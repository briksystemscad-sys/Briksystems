    const MORNING_BUSINESS_SLOTS = ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30'];
    const AFTERNOON_BUSINESS_SLOTS = ['12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00', '17:30'];
    const ALL_BUSINESS_SLOTS = [...MORNING_BUSINESS_SLOTS, ...AFTERNOON_BUSINESS_SLOTS];

    function formatTime12(slotStr) {
      if (!slotStr) return '';
      const [hStr, mStr] = slotStr.split(':');
      const h = parseInt(hStr, 10);
      const m = mStr || '00';
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      return `${h12}:${m} ${ampm}`;
    }

    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      try {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dateObj = new Date(y, m - 1, d);
        return dateObj.toLocaleDateString('en-US', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      } catch (e) {
        return dateStr;
      }
    }

    function extractSlotTime(rawStr) {
      if (!rawStr) return '';
      const match = String(rawStr).match(/T(\d{2}:\d{2})/);
      if (match) return match[1];
      const d = new Date(rawStr);
      return `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
    }

    function getUtcIsoForNewYork(dateStr, timeStr) {
      const [h, m] = (timeStr || '09:00').split(':').map(Number);
      try {
        const testDate = new Date(`${dateStr}T12:00:00Z`);
        const parts = new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/New_York',
          timeZoneName: 'shortOffset'
        }).formatToParts(testDate);
        const tzPart = parts.find(p => p.type === 'timeZoneName');
        const offsetHours = tzPart ? parseInt(tzPart.value.replace('GMT', ''), 10) : -4;
        const offsetStr = `${offsetHours < 0 ? '-' : '+'}${String(Math.abs(offsetHours)).padStart(2, '0')}:00`;
        return new Date(`${dateStr}T${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00${offsetStr}`).toISOString();
      } catch (e) {
        return new Date(`${dateStr}T${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00-04:00`).toISOString();
      }
    }

    function ContactBookingSection() {
      const getInitialDate = () => {
        const d = new Date();
        if (d.getHours() >= 17 && d.getMinutes() >= 30) {
          d.setDate(d.getDate() + 1);
        }
        return d.toISOString().split('T')[0];
      };

      const [formData, setFormData] = useState({
        name: '',
        email: '',
        phone: '',
        service_needed: '',
      });

      const [fieldErrors, setFieldErrors] = useState({});
      const [generalError, setGeneralError] = useState('');

      const [selectedDate, setSelectedDate] = useState(getInitialDate);
      const [selectedSlot, setSelectedSlot] = useState('');
      const selectedSlotRef = useRef('');
      useEffect(() => {
        selectedSlotRef.current = selectedSlot;
      }, [selectedSlot]);
      const [allDaySlots, setAllDaySlots] = useState([]);
      const [bookedSlots, setBookedSlots] = useState([]);
      const [loadingAvailability, setLoadingAvailability] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const submittingRef = useRef(false);
      useEffect(() => {
        submittingRef.current = submitting;
      }, [submitting]);

      const [isConfirmed, setIsConfirmed] = useState(false);
      const isConfirmedRef = useRef(false);
      useEffect(() => {
        isConfirmedRef.current = isConfirmed;
      }, [isConfirmed]);
      const [confirmedBooking, setConfirmedBooking] = useState(null);

      // Square Calendar Month Navigation State
      const [currentMonthDate, setCurrentMonthDate] = useState(() => {
        const init = new Date();
        if (init.getHours() >= 17 && init.getMinutes() >= 30) {
          init.setDate(init.getDate() + 1);
        }
        return new Date(init.getFullYear(), init.getMonth(), 1);
      });

      const todayStr = useMemo(() => new Date().toISOString().split('T')[0], []);

      // Calculate calendar grid days for Square monthly view
      const calendarData = useMemo(() => {
        const year = currentMonthDate.getFullYear();
        const month = currentMonthDate.getMonth();
        const firstDayOfWeek = new Date(year, month, 1).getDay(); // 0 = Sun
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthName = currentMonthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        const days = [];
        for (let i = 0; i < firstDayOfWeek; i++) {
          days.push({ key: `blank-${i}`, isBlank: true });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isPast = new Date(year, month, d, 23, 59, 59).getTime() < new Date().getTime();
          const isSelected = selectedDate === iso;
          const isToday = todayStr === iso;
          days.push({
            key: `day-${d}`,
            dayNum: d,
            iso,
            isPast,
            isSelected,
            isToday,
            isBlank: false,
          });
        }
        return { monthName, days, year, month };
      }, [currentMonthDate, selectedDate, todayStr]);

      const handlePrevMonth = () => {
        const now = new Date();
        const prev = new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth() - 1, 1);
        if (prev.getFullYear() < now.getFullYear() || (prev.getFullYear() === now.getFullYear() && prev.getMonth() < now.getMonth())) {
          return;
        }
        setCurrentMonthDate(prev);
      };

      const handleNextMonth = () => {
        setCurrentMonthDate(new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth() + 1, 1));
      };

      const isPrevMonthDisabled = useMemo(() => {
        const now = new Date();
        return currentMonthDate.getFullYear() === now.getFullYear() && currentMonthDate.getMonth() <= now.getMonth();
      }, [currentMonthDate]);

      const [hasLoadedAvailability, setHasLoadedAvailability] = useState(false);

      // Fetch availability whenever selectedDate changes + auto-refresh every 5s
      useEffect(() => {
        let isCurrent = true;
        let pollTimer = null;

        const fetchAvailability = async (isBackground = false) => {
          if (!selectedDate) return;
          if (!isBackground) {
            setLoadingAvailability(true);
            setGeneralError('');
            setSelectedSlot('');
          }

          // 1. Try serverless backend endpoint (with anti-cache query)
          try {
            const apiRes = await fetch(`/api/availability?date=${encodeURIComponent(selectedDate)}&_t=${Date.now()}`);
            if (apiRes.ok) {
              const resData = await apiRes.json();
              if (isCurrent) {
                const newAll = Array.isArray(resData.allSlots) ? resData.allSlots : [];
                const newBooked = Array.isArray(resData.bookedSlots) ? resData.bookedSlots : [];
                setAllDaySlots(newAll);
                setBookedSlots(newBooked);
                setHasLoadedAvailability(true);
                setLoadingAvailability(false);

                // If currently selected slot got booked in background, deselect & warn user
                const currentSlot = selectedSlotRef.current;
                if (isBackground && currentSlot && newBooked.includes(currentSlot)) {
                  setSelectedSlot('');
                  setGeneralError('The selected time slot was just booked on the live calendar. Please select another time.');
                }
                return;
              }
            }
          } catch (e) {
            console.warn('API availability endpoint notice:', e);
          }

          // 2. Direct SMS Reminder & Google Calendar Live Query
          try {
            const smsUrl = `https://go-interactive.herokuapp.com/v1/availability-slots/compute-slots-for-customer-day?providerId=usr_007UCqZnjYgVb4dI&appointmentTypeId=5aa73161-d540-4906-9b61-11172bd56110&customerDateISO=${encodeURIComponent(selectedDate)}&customerTz=America%2FNew_York&rescheduleCode=`;
            const smsRes = await fetch(smsUrl);
            if (smsRes.ok) {
              const smsData = await smsRes.json();
              if (Array.isArray(smsData.slots)) {
                const avail = [];
                const busy = [];
                for (const s of smsData.slots) {
                  const tStr = extractSlotTime(s.start_time_provider_tz || s.start_time_customer_tz);
                  if (!tStr) continue;
                  if (s.is_free !== false) {
                    avail.push(tStr);
                  } else {
                    busy.push(tStr);
                  }
                }

                let dbOccupied = [];
                if (supabaseClient) {
                  try {
                    const { data: dbSlots } = await supabaseClient
                      .from('bookings')
                      .select('booking_time')
                      .eq('booking_date', selectedDate)
                      .neq('status', 'CANCELLED');
                    if (dbSlots) {
                      dbOccupied = dbSlots.map(s => (s.booking_time || '').slice(0, 5));
                    }
                  } catch (err) {}
                }

                if (isCurrent) {
                  const combinedAll = Array.from(new Set([...avail, ...busy, ...dbOccupied])).sort();
                  const combinedBusy = Array.from(new Set([...busy, ...dbOccupied]));
                  setAllDaySlots(combinedAll);
                  setBookedSlots(combinedBusy);
                  setHasLoadedAvailability(true);
                  setLoadingAvailability(false);

                  const currentSlot = selectedSlotRef.current;
                  if (isBackground && currentSlot && combinedBusy.includes(currentSlot)) {
                    setSelectedSlot('');
                    setGeneralError('The selected time slot was just booked on the live calendar. Please select another time.');
                  }
                  return;
                }
              }
            }
          } catch (smsErr) {
            console.warn('Direct SMS availability notice:', smsErr);
          }

          // 3. Direct Supabase fallback
          try {
            if (supabaseClient) {
              const { data: dbSlots, error: dbErr } = await supabaseClient
                .from('bookings')
                .select('booking_time')
                .eq('booking_date', selectedDate)
                .neq('status', 'CANCELLED');

              if (!dbErr && dbSlots && isCurrent) {
                setBookedSlots(dbSlots.map(s => (s.booking_time || '').slice(0, 5)));
                setHasLoadedAvailability(true);
                setLoadingAvailability(false);
                return;
              }
            }
          } catch (dbErr) {
            console.warn('Direct DB availability error:', dbErr);
          }

          if (isCurrent) {
            setBookedSlots([]);
            setHasLoadedAvailability(true);
            setLoadingAvailability(false);
          }
        };

        fetchAvailability(false);

        // Auto-refresh every 5 seconds to keep live calendar perfectly in sync
        pollTimer = setInterval(() => {
          if (isCurrent && !submittingRef.current && !isConfirmedRef.current) {
            fetchAvailability(true);
          }
        }, 5000);

        return () => {
          isCurrent = false;
          if (pollTimer) clearInterval(pollTimer);
        };
      }, [selectedDate]);

      const effectiveSlots = useMemo(() => {
        if (hasLoadedAvailability) {
          return allDaySlots;
        }
        return allDaySlots && allDaySlots.length > 0 ? allDaySlots : ALL_BUSINESS_SLOTS;
      }, [allDaySlots, hasLoadedAvailability]);

      const morningSlots = useMemo(() => {
        return effectiveSlots.filter(s => parseInt(s.split(':')[0], 10) < 12);
      }, [effectiveSlots]);

      const afternoonSlots = useMemo(() => {
        return effectiveSlots.filter(s => parseInt(s.split(':')[0], 10) >= 12);
      }, [effectiveSlots]);

      const isSlotInPast = (slot) => {
        if (selectedDate !== todayStr) return false;
        const now = new Date();
        const [h, m] = slot.split(':').map(Number);
        const slotTime = new Date();
        slotTime.setHours(h, m, 0, 0);
        return slotTime.getTime() <= now.getTime();
      };

      const handleFieldChange = (field, val) => {
        setFormData(prev => ({ ...prev, [field]: val }));
        if (fieldErrors[field]) {
          setFieldErrors(prev => ({ ...prev, [field]: false }));
        }
        if (generalError) {
          setGeneralError('');
        }
      };

      // Comprehensive validation: Name, Email, Phone, Note, and Time Slot are ALL required
      const validateForm = () => {
        const errors = {};
        const cleanName = formData.name.trim();
        const cleanEmail = formData.email.trim();
        const cleanPhone = formData.phone.trim();
        const cleanService = formData.service_needed.trim();

        if (!cleanName || cleanName.length < 2) {
          errors.name = 'Full name is required';
        }
        if (!cleanEmail || !cleanEmail.includes('@') || !cleanEmail.includes('.')) {
          errors.email = 'Valid email is required';
        }
        if (!cleanPhone || cleanPhone.replace(/\D/g, '').length < 7) {
          errors.phone = 'Valid phone number is required';
        }
        if (!cleanService || cleanService.length < 3) {
          errors.service_needed = 'Please tell us what you need in a brief note';
        }
        if (!selectedSlot) {
          errors.slot = 'Please select an available appointment time slot';
        }

        setFieldErrors(errors);
        return Object.keys(errors).length === 0;
      };

      const handleConfirmBooking = async (e) => {
        if (e) e.preventDefault();
        
        if (!validateForm()) {
          if (!selectedSlot && (formData.name && formData.email && formData.phone && formData.service_needed)) {
            setGeneralError('Please pick an appointment time slot on the right to complete your booking.');
          } else {
            setGeneralError('Please fill out all required fields on the left and select an appointment time.');
          }
          return;
        }

        setSubmitting(true);
        setGeneralError('');

        const bookingPayload = {
          name: formData.name.trim(),
          email: formData.email.trim().toLowerCase(),
          phone: formData.phone.trim(),
          service_needed: formData.service_needed.trim(),
          booking_date: selectedDate,
          booking_time: selectedSlot,
          duration_minutes: 30,
        };

        let serverHandled = false;

        const handleConfirmedRedirect = (confirmedData) => {
          const payload = {
            name: confirmedData?.name || formData.name,
            email: confirmedData?.email || formData.email,
            phone: confirmedData?.phone || formData.phone,
            service_needed: confirmedData?.service_needed || formData.service_needed,
            date: selectedDate,
            time: selectedSlot,
          };
          try {
            sessionStorage.setItem('brik_confirmed_booking', JSON.stringify(payload));
            localStorage.setItem('brik_confirmed_booking', JSON.stringify(payload));
          } catch (e) {}
          setIsConfirmed(true);
          setConfirmedBooking(payload);
          navigateTo('#/confirmation');
        };

        // 1. Try serverless backend
        try {
          const apiRes = await fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bookingPayload),
          });

          if (apiRes.status === 409) {
            const errData = await apiRes.json();
            setGeneralError(errData.error || 'This slot was just booked by another customer. Please choose a different time.');
            setBookedSlots(prev => [...prev, selectedSlot]);
            setSelectedSlot('');
            setSubmitting(false);
            return;
          }

          if (apiRes.ok) {
            const result = await apiRes.json();
            serverHandled = true;
            handleConfirmedRedirect(result.booking || bookingPayload);
            setSubmitting(false);
            return;
          } else if (apiRes.status !== 404) {
            const errData = await apiRes.json().catch(() => ({}));
            setGeneralError(errData.error || 'Failed to process booking. Please try again.');
            setSubmitting(false);
            return;
          }
        } catch (apiErr) {
          console.warn('API booking endpoint notice, executing direct SMS Reminder & DB sync:', apiErr);
        }

        // 2. Direct Fallback Sync
        if (!serverHandled) {
          try {
            let cleanPhone = bookingPayload.phone.replace(/[^\d+]/g, '');
            if (!cleanPhone.startsWith('+')) {
              cleanPhone = '+1' + cleanPhone.replace(/^1/, '');
            }

            const startTimeUtc = getUtcIsoForNewYork(selectedDate, selectedSlot);

            let googleEventId = null;

            // Direct Call to SMS Reminder API
            try {
              const smsResponse = await fetch('https://go-interactive.herokuapp.com/v1/bookings', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Referer': 'https://www.smsreminder.co/',
                  'Origin': 'https://www.smsreminder.co',
                },
                body: JSON.stringify({
                  booking_source: 'web',
                  provider_id: 'usr_007UCqZnjYgVb4dI',
                  appointment_type_id: '5aa73161-d540-4906-9b61-11172bd56110',
                  start_time_utc: startTimeUtc,
                  customer_name: bookingPayload.name,
                  customer_phone: cleanPhone,
                  customer_email: bookingPayload.email,
                  customer_tz: 'America/New_York',
                }),
              });

              if (smsResponse.ok) {
                const resData = await smsResponse.json();
                googleEventId = resData.google_calendar_event_id || resData.id;
              } else {
                const errData = await smsResponse.json().catch(() => ({}));
                setGeneralError(errData.message || 'This time slot is no longer available. Please select another time.');
                setBookedSlots(prev => [...prev, selectedSlot]);
                setSelectedSlot('');
                setSubmitting(false);
                return;
              }
            } catch (smsNetErr) {
              console.warn('Direct SMS Reminder network call notice:', smsNetErr);
            }

            // Sync to Supabase
            let insertedRow = null;
            if (supabaseClient) {
              try {
                const { data: newRow } = await supabaseClient
                  .from('bookings')
                  .insert([
                    {
                      ...bookingPayload,
                      status: 'SYNCED',
                      google_event_id: googleEventId,
                    }
                  ])
                  .select()
                  .single();
                if (newRow) insertedRow = newRow;

                // Insert Lead
                await supabaseClient.from('leads').insert([
                  {
                    name: bookingPayload.name,
                    first_name: bookingPayload.name.split(' ')[0] || '',
                    last_name: bookingPayload.name.split(' ').slice(1).join(' ') || '',
                    email: bookingPayload.email,
                    phone: bookingPayload.phone,
                    service_requested: bookingPayload.service_needed,
                    source: 'Website Booking Flow',
                    status: 'Booked',
                    notes: `Booked for ${selectedDate} at ${formatTime12(selectedSlot)}. Requirements: ${bookingPayload.service_needed}`,
                  }
                ]);
              } catch (dbErr) {
                console.warn('Direct DB sync notice:', dbErr);
              }
            }

            // Dispatch FormSubmit email
            try {
              await fetch('https://formsubmit.co/ajax/iepethankuds@gmail.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({
                  _subject: `New Meeting Booked: ${bookingPayload.name} (${selectedDate} at ${formatTime12(selectedSlot)})`,
                  _template: 'table',
                  _captcha: 'false',
                  name: bookingPayload.name,
                  email: bookingPayload.email,
                  phone: bookingPayload.phone,
                  date: selectedDate,
                  time: formatTime12(selectedSlot),
                  what_they_need: bookingPayload.service_needed,
                  google_calendar_sync: googleEventId ? `CONFIRMED (Event ID: ${googleEventId})` : 'Synced via SMS Reminder',
                })
              });
            } catch (e) {
              console.warn('Email notify notice:', e);
            }

            handleConfirmedRedirect(insertedRow || bookingPayload);
            setSubmitting(false);
            return;
          } catch (fbErr) {
            console.error('Booking fallback error:', fbErr);
            handleConfirmedRedirect(bookingPayload);
            setSubmitting(false);
            return;
          }
        }

        setSubmitting(false);
      };

      const googleCalendarLink = useMemo(() => {
        if (!selectedDate || !selectedSlot) return '#';
        const [h, m] = selectedSlot.split(':').map(Number);
        const start = new Date(`${selectedDate}T${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`);
        const end = new Date(start.getTime() + 30 * 60 * 1000);
        const fmt = (d) => d.toISOString().replace(/-|:|\.\d+/g, '');
        const dates = `${fmt(start)}/${fmt(end)}`;
        const title = encodeURIComponent(`Brik Systems Consultation — ${formData.name || 'Meeting'}`);
        const details = encodeURIComponent(`Consultation meeting with ${formData.name}\nEmail: ${formData.email}\nPhone: ${formData.phone}\nTopic: ${formData.service_needed}\nScheduled via BrikSystems Booking System`);
        return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&add=ipethankuds@gmail.com`;
      }, [selectedDate, selectedSlot, formData]);

      const resetBooking = () => {
        setIsConfirmed(false);
        setConfirmedBooking(null);
        setSelectedSlot('');
        setFormData({ name: '', email: '', phone: '', service_needed: '' });
        setFieldErrors({});
        setGeneralError('');
      };

      const inputBaseClass = 'flex h-10 w-full rounded-xl border bg-white px-3.5 py-2 text-sm focus:outline-none focus:ring-2 transition shadow-2xs placeholder:text-slate-400';

      return (
        <section className="relative overflow-hidden px-4 sm:px-6 lg:px-8 pt-4 pb-12 sm:pt-6 sm:pb-16 max-w-5xl mx-auto animate-fade-in-up">
          {/* Subtle Ambient Background Gradients */}
          <div className="brik-grid-bg pointer-events-none absolute inset-0 opacity-40 [mask-image:radial-gradient(ellipse_at_top,black,transparent_75%)]"></div>
          <div className="pointer-events-none absolute -top-20 left-1/2 -translate-x-1/2 w-80 h-80 bg-ember-500/10 rounded-full blur-3xl"></div>

          <div className="relative">
            {/* Ultra-Clean Compact Header */}
            <div className="text-center max-w-xl mx-auto mb-6 sm:mb-8">
              <span className="inline-flex items-center gap-1.5 rounded-full border border-ember-200 bg-ember-50/80 px-3 py-0.5 text-xs font-bold text-ember-700 shadow-2xs">
                <span className="w-1.5 h-1.5 rounded-full bg-ember-500 animate-pulse"></span>
                Free 30-Min Strategy Call
              </span>
              <h1 className="mt-2 text-2xl sm:text-3xl lg:text-4xl font-black text-slate-900 tracking-tight">
                Book Your Consultation
              </h1>
              <p className="mt-1.5 text-xs sm:text-sm text-slate-600">
                Choose an appointment slot on the calendar and enter your details to reserve your session.
              </p>
            </div>

            {/* Main Unified 2-Column Minimalist Booking Card */}
            <div className="rounded-3xl border border-slate-200/90 bg-white shadow-xl shadow-slate-900/[0.04] overflow-hidden">
              {isConfirmed ? (
                /* CONFIRMED STATE */
                <div className="p-8 sm:p-12 text-center max-w-lg mx-auto space-y-5 animate-fade-in-up">
                  <div className="w-16 h-16 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-600 flex items-center justify-center mx-auto shadow-sm animate-bounce">
                    <Icon name="circle-check" className="w-9 h-9" />
                  </div>

                  <div className="space-y-1.5">
                    <span className="inline-flex items-center gap-1.5 bg-emerald-100 text-emerald-800 text-[11px] px-3 py-0.5 rounded-full font-bold uppercase tracking-wider">
                      ✓ Confirmed
                    </span>
                    <h2 className="text-2xl font-black text-slate-900">
                      Thanks, {confirmedBooking?.name || formData.name}!
                    </h2>
                    <p className="text-xs sm:text-sm text-slate-600">
                      We’ve reserved your slot. A confirmation and calendar invite have been sent to <span className="font-bold text-slate-900">{confirmedBooking?.email || formData.email}</span>.
                    </p>
                  </div>

                  {/* Summary Card */}
                  <div className="rounded-2xl border border-slate-200 bg-slate-50/80 p-5 text-left space-y-3 shadow-2xs">
                    <div className="flex items-start justify-between border-b border-slate-200 pb-3">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-sm shrink-0">
                          <Icon name="calendar" className="w-5 h-5 text-ember-400" />
                        </div>
                        <div>
                          <p className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Date &amp; Time</p>
                          <p className="text-sm font-bold text-slate-900">
                            {formatDateDisplay(selectedDate)}
                          </p>
                          <p className="text-xs font-semibold text-ember-600">
                            {formatTime12(selectedSlot)} (30 minutes)
                          </p>
                        </div>
                      </div>
                      <span className="text-[11px] bg-emerald-500 text-white px-2.5 py-0.5 rounded-full font-bold">
                        Confirmed

    function BookingModal({ customerData, onClose, onBookingSuccess }) {
      // Initialize starting date (today or tomorrow if after 17:30)
      const getInitialDate = () => {
        const d = new Date();
        if (d.getHours() >= 17 && d.getMinutes() >= 30) {
          d.setDate(d.getDate() + 1);
        }
        return d.toISOString().split('T')[0];
      };

      const [selectedDate, setSelectedDate] = useState(getInitialDate);
      const [selectedSlot, setSelectedSlot] = useState('');
      const selectedSlotRef = useRef('');
      useEffect(() => {
        selectedSlotRef.current = selectedSlot;
      }, [selectedSlot]);
      const [allDaySlots, setAllDaySlots] = useState([]);
      const [bookedSlots, setBookedSlots] = useState([]);
      const [loadingAvailability, setLoadingAvailability] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const submittingRef = useRef(false);
      useEffect(() => {
        submittingRef.current = submitting;
      }, [submitting]);

      const [errorMessage, setErrorMessage] = useState('');
      const [isConfirmed, setIsConfirmed] = useState(false);
      const isConfirmedRef = useRef(false);
      useEffect(() => {
        isConfirmedRef.current = isConfirmed;
      }, [isConfirmed]);
      const [confirmedBooking, setConfirmedBooking] = useState(null);

      // Square Calendar Month Navigation State
      const [currentMonthDate, setCurrentMonthDate] = useState(() => {
        const init = new Date();
        if (init.getHours() >= 17 && init.getMinutes() >= 30) {
          init.setDate(init.getDate() + 1);
        }
        return new Date(init.getFullYear(), init.getMonth(), 1);
      });

      const todayStr = useMemo(() => new Date().toISOString().split('T')[0], []);

      // Calculate calendar grid days for Square monthly view
      const calendarData = useMemo(() => {
        const year = currentMonthDate.getFullYear();
        const month = currentMonthDate.getMonth();
        const firstDayOfWeek = new Date(year, month, 1).getDay(); // 0 = Sun
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const monthName = currentMonthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        const days = [];
        // Leading blank days
        for (let i = 0; i < firstDayOfWeek; i++) {
          days.push({ key: `blank-${i}`, isBlank: true });
        }
        // Month days
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isPast = new Date(year, month, d, 23, 59, 59).getTime() < new Date().getTime();
          const isSelected = selectedDate === iso;
          const isToday = todayStr === iso;
          days.push({
            key: `day-${d}`,
            dayNum: d,
            iso,
            isPast,
            isSelected,
            isToday,
            isBlank: false,
          });
        }

        return { monthName, days, year, month };
      }, [currentMonthDate, selectedDate, todayStr]);

      const handlePrevMonth = () => {
        const now = new Date();
        const prev = new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth() - 1, 1);
        // Do not allow going before current month
        if (prev.getFullYear() < now.getFullYear() || (prev.getFullYear() === now.getFullYear() && prev.getMonth() < now.getMonth())) {
          return;
        }
        setCurrentMonthDate(prev);
      };

      const handleNextMonth = () => {
        setCurrentMonthDate(new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth() + 1, 1));
      };

      const isPrevMonthDisabled = useMemo(() => {
        const now = new Date();
        return currentMonthDate.getFullYear() === now.getFullYear() && currentMonthDate.getMonth() <= now.getMonth();
      }, [currentMonthDate]);

      const [hasLoadedAvailability, setHasLoadedAvailability] = useState(false);

      // Fetch availability whenever selectedDate changes + auto-refresh every 5s
      useEffect(() => {
        let isCurrent = true;
        let pollTimer = null;

        const fetchAvailability = async (isBackground = false) => {
          if (!selectedDate) return;
          if (!isBackground) {
            setLoadingAvailability(true);
            setErrorMessage('');
            setSelectedSlot('');
          }

          // 1. Try serverless backend endpoint
          try {
            const apiRes = await fetch(`/api/availability?date=${encodeURIComponent(selectedDate)}&_t=${Date.now()}`);
            if (apiRes.ok) {
              const resData = await apiRes.json();
              if (isCurrent) {
                const newAll = Array.isArray(resData.allSlots) ? resData.allSlots : [];
                const newBooked = Array.isArray(resData.bookedSlots) ? resData.bookedSlots : [];
                setAllDaySlots(newAll);
                setBookedSlots(newBooked);
                setHasLoadedAvailability(true);
                setLoadingAvailability(false);

                const currentSlot = selectedSlotRef.current;
                if (isBackground && currentSlot && newBooked.includes(currentSlot)) {
                  setSelectedSlot('');
                  setErrorMessage('The selected time slot was just booked on the live calendar. Please select another time.');
                }
                return;
              }
            }
          } catch (e) {
            console.warn('API availability endpoint not reachable, checking direct SMS Reminder API:', e);
          }

          // 2. Direct SMS Reminder & Google Calendar Live Query
          try {
            const smsUrl = `https://go-interactive.herokuapp.com/v1/availability-slots/compute-slots-for-customer-day?providerId=usr_007UCqZnjYgVb4dI&appointmentTypeId=5aa73161-d540-4906-9b61-11172bd56110&customerDateISO=${encodeURIComponent(selectedDate)}&customerTz=America%2FNew_York&rescheduleCode=`;
            const smsRes = await fetch(smsUrl);
            if (smsRes.ok) {
              const smsData = await smsRes.json();
              if (Array.isArray(smsData.slots)) {
                const avail = [];
                const busy = [];
                for (const s of smsData.slots) {
                  const tStr = extractSlotTime(s.start_time_provider_tz || s.start_time_customer_tz);
                  if (!tStr) continue;
                  if (s.is_free !== false) {
                    avail.push(tStr);
                  } else {
                    busy.push(tStr);
                  }
                }

                // Check Supabase occupied slots
                let dbOccupied = [];
                if (supabaseClient) {
                  try {
                    const { data: dbSlots } = await supabaseClient
                      .from('bookings')
                      .select('booking_time')
                      .eq('booking_date', selectedDate)
                      .neq('status', 'CANCELLED');
                    if (dbSlots) {
                      dbOccupied = dbSlots.map(s => (s.booking_time || '').slice(0, 5));
                    }
                  } catch (err) {}
                }

                if (isCurrent) {
                  const combinedAll = Array.from(new Set([...avail, ...busy, ...dbOccupied])).sort();
                  const combinedBusy = Array.from(new Set([...busy, ...dbOccupied]));
                  setAllDaySlots(combinedAll);
                  setBookedSlots(combinedBusy);
                  setHasLoadedAvailability(true);
                  setLoadingAvailability(false);

                  const currentSlot = selectedSlotRef.current;
                  if (isBackground && currentSlot && combinedBusy.includes(currentSlot)) {
                    setSelectedSlot('');
                    setErrorMessage('The selected time slot was just booked on the live calendar. Please select another time.');
                  }
                  return;
                }
              }
            }
          } catch (smsErr) {
            console.warn('Direct SMS availability error:', smsErr);
          }

          // 3. Direct Supabase fallback
          try {
            if (supabaseClient) {
              const { data: dbSlots, error: dbErr } = await supabaseClient
                .from('bookings')
                .select('booking_time')
                .eq('booking_date', selectedDate)
                .neq('status', 'CANCELLED');

              if (!dbErr && dbSlots && isCurrent) {
                setBookedSlots(dbSlots.map(s => (s.booking_time || '').slice(0, 5)));
                setHasLoadedAvailability(true);
                setLoadingAvailability(false);
                return;
              }
            }
          } catch (dbErr) {
            console.warn('Direct Supabase availability error:', dbErr);
          }

          if (isCurrent) {
            setBookedSlots([]);
            setHasLoadedAvailability(true);
            setLoadingAvailability(false);
          }
        };

        fetchAvailability(false);

        // Auto-refresh every 5 seconds while modal is open
        pollTimer = setInterval(() => {
          if (isCurrent && !submittingRef.current && !isConfirmedRef.current) {
            fetchAvailability(true);
          }
        }, 5000);

        return () => {
          isCurrent = false;
          if (pollTimer) clearInterval(pollTimer);
        };
      }, [selectedDate]);

      const effectiveSlots = useMemo(() => {
        if (hasLoadedAvailability) {
          return allDaySlots;
        }
        return allDaySlots && allDaySlots.length > 0 ? allDaySlots : ALL_BUSINESS_SLOTS;
      }, [allDaySlots, hasLoadedAvailability]);

      const morningSlots = useMemo(() => {
        return effectiveSlots.filter(s => parseInt(s.split(':')[0], 10) < 12);
      }, [effectiveSlots]);

      const afternoonSlots = useMemo(() => {
        return effectiveSlots.filter(s => parseInt(s.split(':')[0], 10) >= 12);
      }, [effectiveSlots]);

      // Check if slot has passed today
      const isSlotInPast = (slot) => {
        if (selectedDate !== todayStr) return false;
        const now = new Date();
        const [h, m] = slot.split(':').map(Number);
        const slotTime = new Date();
        slotTime.setHours(h, m, 0, 0);
        return slotTime.getTime() <= now.getTime();
      };

      // Confirm Booking Handler
      const handleConfirmBooking = async (e) => {
        e.preventDefault();
        if (!selectedDate || !selectedSlot) {
          setErrorMessage('Please select an available appointment time slot.');
          return;
        }

        setSubmitting(true);
        setErrorMessage('');

        const bookingPayload = {
          name: (customerData?.name || '').trim(),
          email: (customerData?.email || '').trim().toLowerCase(),
          phone: (customerData?.phone || '').trim(),
          service_needed: (customerData?.service_needed || '').trim(),
          booking_date: selectedDate,
          booking_time: selectedSlot,
          duration_minutes: 30,
        };

        let serverHandled = false;

        // 1. Try serverless backend
        try {
          const apiRes = await fetch('/api/bookings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(bookingPayload),
          });

          if (apiRes.status === 409) {
            const errData = await apiRes.json();
            setErrorMessage(errData.error || 'This slot was just booked by another customer. Please choose a different time.');
            setBookedSlots(prev => [...prev, selectedSlot]);
            setSelectedSlot('');
            setSubmitting(false);
            return;
          }

          if (apiRes.ok) {
            const result = await apiRes.json();
            serverHandled = true;
            setIsConfirmed(true);
            setConfirmedBooking(result.booking || bookingPayload);
            if (onBookingSuccess) onBookingSuccess(result.booking || bookingPayload);
            setSubmitting(false);
            return;
          } else if (apiRes.status !== 404) {
            const errData = await apiRes.json().catch(() => ({}));
            setErrorMessage(errData.error || 'Failed to process booking. Please try again.');
            setSubmitting(false);
            return;
          }
        } catch (apiErr) {
          console.warn('API booking endpoint offline, executing direct SMS Reminder & Google Calendar sync:', apiErr);
        }

        // 2. Direct SMS Reminder & Google Calendar Synchronization (Works everywhere, including local Vite preview)
        if (!serverHandled) {
          try {
            let cleanPhone = bookingPayload.phone.replace(/[^\d+]/g, '');
            if (!cleanPhone.startsWith('+')) {
              cleanPhone = '+1' + cleanPhone.replace(/^1/, '');
            }

            const startTimeUtc = getUtcIsoForNewYork(selectedDate, selectedSlot);

            let googleEventId = null;

            // Direct Call to SMS Reminder API
            try {
              const smsResponse = await fetch('https://go-interactive.herokuapp.com/v1/bookings', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Referer': 'https://www.smsreminder.co/',
                  'Origin': 'https://www.smsreminder.co',
                },
                body: JSON.stringify({
                  booking_source: 'web',
                  provider_id: 'usr_007UCqZnjYgVb4dI',
                  appointment_type_id: '5aa73161-d540-4906-9b61-11172bd56110',
                  start_time_utc: startTimeUtc,
                  customer_name: bookingPayload.name,
                  customer_phone: cleanPhone,
                  customer_email: bookingPayload.email,
                  customer_tz: 'America/New_York',
                }),
              });

              if (smsResponse.ok) {
                const resData = await smsResponse.json();
                googleEventId = resData.google_calendar_event_id || resData.id;
              } else {
                const errData = await smsResponse.json().catch(() => ({}));
                setErrorMessage(errData.message || 'This time slot is no longer available. Please select another time.');
                setBookedSlots(prev => [...prev, selectedSlot]);
                setSelectedSlot('');
                setSubmitting(false);
                return;
              }
            } catch (smsNetErr) {
              console.warn('Direct SMS Reminder network call notice:', smsNetErr);
            }

            // Sync to Supabase
            let insertedRow = null;
            if (supabaseClient) {
              try {
                const { data: newRow } = await supabaseClient
                  .from('bookings')
                  .insert([
                    {
                      ...bookingPayload,
                      status: 'SYNCED',
                      google_event_id: googleEventId,
                    }
                  ])
                  .select()
                  .single();
                if (newRow) insertedRow = newRow;

                // Insert Lead
                await supabaseClient.from('leads').insert([
                  {
                    name: bookingPayload.name,
                    first_name: bookingPayload.name.split(' ')[0] || '',
                    last_name: bookingPayload.name.split(' ').slice(1).join(' ') || '',
                    email: bookingPayload.email,
                    phone: bookingPayload.phone,
                    service_requested: bookingPayload.service_needed,
                    source: 'Website Booking Flow',
                    status: 'Booked',
                    notes: `Booked for ${selectedDate} at ${formatTime12(selectedSlot)}. Requirements: ${bookingPayload.service_needed}`,
                  }
                ]);
              } catch (dbErr) {
                console.warn('Direct DB sync notice:', dbErr);
              }
            }

            // Dispatch FormSubmit email to admin
            try {
              await fetch('https://formsubmit.co/ajax/iepethankuds@gmail.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                body: JSON.stringify({
                  _subject: `New Meeting Booked: ${bookingPayload.name} (${selectedDate} at ${formatTime12(selectedSlot)})`,
                  _template: 'table',
                  _captcha: 'false',
                  name: bookingPayload.name,
                  email: bookingPayload.email,
                  phone: bookingPayload.phone,
                  date: selectedDate,
                  time: formatTime12(selectedSlot),
                  what_they_need: bookingPayload.service_needed,
                  google_calendar_sync: googleEventId ? `CONFIRMED (Event ID: ${googleEventId})` : 'Synced via SMS Reminder',
                })
              });
            } catch (e) {
              console.warn('Email notify notice:', e);
            }

            setIsConfirmed(true);
            setConfirmedBooking(insertedRow || bookingPayload);
            if (onBookingSuccess) onBookingSuccess(insertedRow || bookingPayload);
            setSubmitting(false);
            return;
          } catch (fbErr) {
            console.error('Booking fallback error:', fbErr);
            setIsConfirmed(true);
            setConfirmedBooking(bookingPayload);
            setSubmitting(false);
            return;
          }
        }

        setSubmitting(false);
      };

      const googleCalendarLink = useMemo(() => {
        if (!selectedDate || !selectedSlot) return '#';
        const [h, m] = selectedSlot.split(':').map(Number);
        const start = new Date(`${selectedDate}T${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`);
        const end = new Date(start.getTime() + 30 * 60 * 1000);
        const fmt = (d) => d.toISOString().replace(/-|:|\.\d+/g, '');
        const dates = `${fmt(start)}/${fmt(end)}`;
        const title = encodeURIComponent(`Brik Systems Consultation — ${customerData?.name || 'Meeting'}`);
        const details = encodeURIComponent(`Consultation meeting with ${customerData?.name}\nEmail: ${customerData?.email}\nPhone: ${customerData?.phone}\nTopic: ${customerData?.service_needed}\nScheduled via BrikSystems Booking System`);
        return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${dates}&details=${details}&add=ipethankuds@gmail.com`;
      }, [selectedDate, selectedSlot, customerData]);

      return (
        <div className="fixed inset-0 z-[100] bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
          <div className="bg-white rounded-3xl max-w-3xl w-full shadow-2xl overflow-hidden border border-slate-200 animate-fade-in-up my-4">
            
            {/* Square Header Bar */}
            <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-white">
              <div className="flex items-center gap-3">
                <BrikLogo className="h-4 w-4" />
                <div>
                  <h3 className="text-base font-extrabold text-slate-900 leading-tight">
                    {isConfirmed ? 'Booking Confirmed' : 'Select Date & Time'}
                  </h3>
                  <p className="text-xs text-slate-500 font-medium">Brik Systems • 30 min Consultation</p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:text-slate-900 hover:bg-slate-200 flex items-center justify-center transition font-bold text-sm"
                aria-label="Close"
              >
                ✕
              </button>
            </div>

            {/* CONFIRMED STATE */}
            {isConfirmed ? (
              <div className="p-6 sm:p-10 space-y-6 text-center max-w-lg mx-auto">
                <div className="w-16 h-16 rounded-full bg-emerald-50 border border-emerald-100 text-emerald-600 flex items-center justify-center mx-auto shadow-sm animate-bounce">
                  <Icon name="circle-check" className="w-9 h-9" />
                </div>

                <div className="space-y-2">
                  <span className="inline-flex items-center gap-1.5 bg-emerald-100 text-emerald-800 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wider">
                    Booking Confirmed
                  </span>
                  <h2 className="text-2xl font-black text-slate-900">
                    Thanks! Your meeting has been booked.
                  </h2>
                  <p className="text-sm text-slate-600">
                    We’ve reserved your 30-minute slot. A confirmation email has been dispatched to <span className="font-semibold text-slate-800">{customerData?.email}</span>.
                  </p>
                </div>

                {/* Appointment Detail Summary Card */}
                <div className="rounded-2xl border border-slate-200 bg-slate-50 p-5 text-left space-y-3 shadow-inner">
                  <div className="flex items-start justify-between border-b border-slate-200 pb-3">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-sm">
                        <Icon name="calendar" className="w-5 h-5 text-ember-400" />
                      </div>
                      <div>
                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Date & Time</p>
                        <p className="text-base font-bold text-slate-900">
                          {formatDateDisplay(selectedDate)}
                        </p>
                        <p className="text-sm font-semibold text-ember-600">
                          {formatTime12(selectedSlot)} (30 min)
                        </p>
                      </div>
                    </div>
                    <span className="text-xs bg-emerald-500 text-white px-2.5 py-0.5 rounded-full font-bold">
                      Confirmed
                    </span>
                  </div>

                  <div className="grid grid-cols-2 gap-2 text-xs text-slate-600 pt-1">
                    <div>
                      <span className="text-slate-400 block font-medium">Customer:</span>
                      <span className="font-bold text-slate-800">{customerData?.name}</span>
                    </div>
                    <div>
                      <span className="text-slate-400 block font-medium">Phone:</span>
                      <span className="font-bold text-slate-800">{customerData?.phone}</span>
                    </div>
                    <div className="col-span-2">
                      <span className="text-slate-400 block font-medium">Topic:</span>
                      <span className="font-medium text-slate-800 line-clamp-2">{customerData?.service_needed}</span>
                    </div>
                  </div>
                </div>

                {/* Action Buttons */}
                <div className="flex flex-col sm:flex-row gap-3 pt-2">
                  <button
                    onClick={onClose}
                    className="flex-1 bg-ember-500 hover:bg-ember-600 text-white font-bold py-3.5 px-4 rounded-xl text-sm transition shadow-md"
                  >
                    Done
                  </button>
                </div>
              </div>
            ) : (
              /* SQUARE APPOINTMENTS 2-COLUMN BOOKING INTERFACE */
              <form onSubmit={handleConfirmBooking} className="flex flex-col">
                <div className="grid lg:grid-cols-[1.1fr_1fr] divide-y lg:divide-y-0 lg:divide-x divide-slate-200">
                  
                  {/* LEFT COLUMN: SQUARE MONTHLY CALENDAR PICKER */}
                  <div className="p-6 sm:p-7 space-y-5 bg-white">
                    {/* Customer pill badge */}
                    <div className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs text-slate-700">
                      <div className="truncate">
                        <span className="font-bold text-slate-900">{customerData?.name || 'Customer'}</span>
                        <span className="text-slate-500 ml-1.5">({customerData?.phone})</span>
                      </div>
                      <span className="text-[11px] font-bold text-ember-600 uppercase tracking-wider shrink-0">30 Min</span>
                    </div>

                    {/* Square Month Navigator Header */}
                    <div className="flex items-center justify-between pt-1">
                      <h4 className="text-base font-black text-slate-900 tracking-tight">
                        {calendarData.monthName}
                      </h4>
                      <div className="flex items-center gap-1">
                        <button
                          type="button"
                          disabled={isPrevMonthDisabled}
                          onClick={handlePrevMonth}
                          className="w-8 h-8 rounded-full border border-slate-200 hover:border-slate-400 hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center text-slate-700 transition"
                          aria-label="Previous Month"
                        >
                          <Icon name="arrow-left" className="w-4 h-4" />
                        </button>
                        <button
                          type="button"
                          onClick={handleNextMonth}
                          className="w-8 h-8 rounded-full border border-slate-200 hover:border-slate-400 hover:bg-slate-50 flex items-center justify-center text-slate-700 transition"
                          aria-label="Next Month"
                        >
                          <Icon name="arrow-right" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>

                    {/* Square Calendar Days Grid */}
                    <div className="space-y-1.5">
                      {/* Day of Week Labels */}
                      <div className="grid grid-cols-7 text-center">
                        {['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].map((dow) => (
                          <span key={dow} className="text-[10px] font-bold tracking-wider text-slate-400 py-1">
                            {dow}
                          </span>
                        ))}
                      </div>

                      {/* Day Cells */}
                      <div className="grid grid-cols-7 gap-1.5 text-center">
                        {calendarData.days.map((item) => {
                          if (item.isBlank) {
                            return <div key={item.key} className="h-9 w-9 sm:h-10 sm:w-10" />;
                          }

                          return (
                            <button
                              key={item.key}
                              type="button"
                              disabled={item.isPast}
                              onClick={() => setSelectedDate(item.iso)}
                              className={`h-9 w-9 sm:h-10 sm:w-10 mx-auto rounded-full text-xs font-bold transition-all relative flex flex-col items-center justify-center ${
                                item.isPast
                                  ? 'text-slate-300 opacity-40 cursor-not-allowed pointer-events-none'
                                  : item.isSelected
                                  ? 'bg-slate-900 text-white shadow-md font-extrabold scale-105 ring-2 ring-slate-900/20'
                                  : item.isToday
                                  ? 'border-2 border-ember-500 text-ember-600 font-extrabold hover:bg-ember-50'
                                  : 'text-slate-800 hover:bg-slate-100 hover:text-slate-950 font-semibold'
                              }`}
                            >
                              <span>{item.dayNum}</span>
                              {!item.isPast && !item.isSelected && (
                                <span className="w-1 h-1 rounded-full bg-ember-500 mt-0.5"></span>
                              )}
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {/* Timezone pill */}
                    <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                      <span>Timezone</span>
                      <span className="font-semibold text-slate-600">America/Toronto (EDT)</span>
                    </div>
                  </div>

                  {/* RIGHT COLUMN: SQUARE TIME SLOTS SELECTION */}
                  <div className="p-6 sm:p-7 space-y-5 bg-slate-50/50 flex flex-col justify-between">
                    <div className="space-y-4">
                      {/* Date Heading */}
                      <div>
                        <span className="text-[10px] font-extrabold uppercase tracking-widest text-ember-600">
                          Step 2 • Select Time
                        </span>
                        <h4 className="text-lg font-black text-slate-900 mt-0.5">
                          {formatDateDisplay(selectedDate)}
                        </h4>
                      </div>

                      {/* Error banner */}
                      {errorMessage && (

    // =========================================================================
    // LaptopCarouselShowcase — Center Fixed Laptop with Moving Background Cards
    // Exactly matches the video reference! Clean, visual-first, personalized
    // for Brik Systems' clean light theme. Autoplays 2s for normal sites, 5s for Velora Grand.
    // =========================================================================
    function LaptopCarouselShowcase({ items }) {
      const count = items.length;
      const motionMs = 900;
      const [slide, setSlide] = useState({ position: count, previous: null, direction: 1, moving: false });
      const activeIdx = count ? ((slide.position % count) + count) % count : 0;
      const [iframeLoadedMap, setIframeLoadedMap] = useState({});
      const [mountedFrames, setMountedFrames] = useState(() => new Set([0, 1]));
      const [isInView, setIsInView] = useState(false);
      const [reducedMotion, setReducedMotion] = useState(false);
      const sectionRef = useRef(null);
      const movingRef = useRef(false);
      const trackRef = useRef(null);
      const timelineRef = useRef({ position: count, elapsed: 0, manual: null });
      const advanceRef = useRef(null);

      const advance = (delta, automatic = false) => {
        if (count < 2 || movingRef.current || !delta) return;
        movingRef.current = true;
        const timeline = timelineRef.current;
        if (!automatic) {
          timeline.manual = { from: timeline.position + timeline.elapsed / 5000, to: timeline.position + delta, started: null };
          timeline.elapsed = 0;
        }
        timeline.position += delta;
        setSlide(prev => ({ position: prev.position + delta, previous: ((prev.position % count) + count) % count, direction: Math.sign(delta), moving: true }));
      };
      advanceRef.current = advance;
      const selectIndex = (index) => {
        let delta = index - activeIdx;
        if (delta > count / 2) delta -= count;
        if (delta < -count / 2) delta += count;
        advance(delta);
      };

      useEffect(() => {
        const query = window.matchMedia('(prefers-reduced-motion: reduce)');
        const update = () => setReducedMotion(query.matches);
        update();
        query.addEventListener('change', update);
        const observer = new IntersectionObserver(([entry]) => setIsInView(entry.isIntersecting), { threshold: 0.15 });
        if (sectionRef.current) observer.observe(sectionRef.current);
        return () => { query.removeEventListener('change', update); observer.disconnect(); };
      }, []);

      useEffect(() => {
        if (!count) return;
        setMountedFrames(prev => {
          const next = new Set(prev);
          next.add(activeIdx);
          next.add((activeIdx + 1) % count);
          next.add((activeIdx - 1 + count) % count);
          return next;
        });
      }, [activeIdx, count]);

      useEffect(() => {
        if (!slide.moving) return;
        const timer = setTimeout(() => {
          // Identical adjacent copies make this reset invisible at either end.
          setSlide(prev => {
            const position = count + ((prev.position % count) + count) % count;
            const shift = position - prev.position;
            timelineRef.current.position += shift;
            if (timelineRef.current.manual) {
              timelineRef.current.manual.from += shift;
              timelineRef.current.manual.to += shift;
            }
            return { ...prev, position, previous: null, moving: false };
          });
          movingRef.current = false;
        }, reducedMotion ? 0 : motionMs);
        return () => clearTimeout(timer);
      }, [slide.moving, count, reducedMotion]);

      // Card pastel palette matching the vibrant reference video
      const cardBgColors = [
        '#fef3c7', // Amber/gold
        '#fef08a', // Yellow (Velora Grand)
        '#e0f2fe', // Sky blue
        '#dcfce7', // Mint/emerald
        '#f3e8ff', // Soft purple
        '#ffe4e6', // Soft rose
        '#ecfeff', // Cyan
        '#fae8ff', // Fuchsia
        '#ffedd5', // Warm orange
        '#f1f5f9', // Slate
        '#e2e8f0', // Soft grey
      ];

      const getDuration = () => 5000;
      useEffect(() => {
        if (count < 2 || !isInView || reducedMotion) return;
        let frame = 0;
        let lastTime = null;
        const tick = time => {
          const timeline = timelineRef.current;
          const delta = lastTime === null ? 0 : Math.min(time - lastTime, 100);
          lastTime = time;
          let position;
          if (timeline.manual) {
            const motion = timeline.manual;
            if (motion.started === null) motion.started = time;
            const progress = Math.min((time - motion.started) / motionMs, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            position = motion.from + (motion.to - motion.from) * eased;
            if (progress === 1) timeline.manual = null;
          } else {
            timeline.elapsed += delta;
            if (timeline.elapsed >= getDuration() && !movingRef.current) {
              timeline.elapsed -= getDuration();
              advanceRef.current(1, true);
            }
            position = timeline.position + timeline.elapsed / getDuration();
          }
          trackRef.current?.style.setProperty('--carousel-offset', (-position * 444) + 'px');
          frame = requestAnimationFrame(tick);
        };
        frame = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(frame);
      }, [count, isInView, reducedMotion]);
      useEffect(() => {
        if (reducedMotion || !isInView) {
          timelineRef.current.manual = null;
          trackRef.current?.style.setProperty('--carousel-offset', (-slide.position * 444) + 'px');
        }
      }, [slide.position, isInView, reducedMotion]);

      if (!count) return null;
      const currentItem = items[activeIdx] || items[0];
      const isVelora = currentItem.name === 'Velora Grand';

      // Horizontally long rectangle cards (widescreen 16:10 format)
      // Card width (420px) + gap (24px) = 444px shift per index
      const cardStep = 444;
      const trackOffset = -count * cardStep;

      return (
        <div 
          ref={sectionRef}
          data-home-motion="showcase"

          className="relative w-full overflow-hidden select-none"
        >
          {/* Top Pill Controls & Counter */}
          <div className="max-w-6xl mx-auto flex items-center justify-between px-6 mb-8">
            <div className="flex items-center gap-2.5">
              <span className="relative flex h-2.5 w-2.5">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
              </span>
              <span className="font-mono text-xs font-bold uppercase tracking-wider text-slate-700">
                Live Production Engines · {activeIdx + 1} of {items.length}
              </span>
            </div>

            {/* Step navigation dots & timer indicator */}
            <div className="flex items-center gap-1.5 sm:gap-2">
              {items.map((it, idx) => {
                const isActive = idx === activeIdx;
                return (
                  <button
                    key={it.name}
                    onClick={() => selectIndex(idx)}
                    className="relative p-1 focus:outline-none transition-transform hover:scale-125"
                    title={it.name}
                  >
                    <span
                      className={`block rounded-full transition-all duration-300 ${
                        isActive
                          ? 'w-7 h-2.5 bg-ember-500 shadow-sm'
                          : 'w-2.5 h-2.5 bg-slate-300 hover:bg-slate-400'
                      }`}
                    />
                  </button>
                );
              })}
            </div>
          </div>

          {/* ================================================================= */}
          {/* STAGE: CENTER LAPTOP WITH PASSING CARDS TRACK (EXACT VIDEO MATCH) */}

    // =========================================================================
    // Cinematic Motion Video & Dynamic Particle Canvas for About Page
    // =========================================================================
    // =========================================================================
    // Cinematic Motion Video & 3D Glowing Wave Canvas for About Page
    // =========================================================================
    function AboutHeroVideo() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let width = (canvas.width = canvas.offsetWidth);
        let height = (canvas.height = canvas.offsetHeight);
        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetMouseX = width / 2;
        let targetMouseY = height / 2;

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = canvas.offsetWidth;
          height = canvas.height = canvas.offsetHeight;
        };

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          targetMouseX = e.clientX - rect.left;
          targetMouseY = e.clientY - rect.top;
        };

        window.addEventListener('resize', handleResize);
        window.addEventListener('mousemove', handleMouseMove);

        // Nodes
        const numNodes = 55;
        const nodes = Array.from({ length: numNodes }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6,
          radius: Math.random() * 2.2 + 1,
          baseAlpha: Math.random() * 0.5 + 0.3,
          color: Math.random() > 0.35 ? '249, 115, 22' : '245, 158, 11'
        }));

        let step = 0;

        const draw = () => {
          step += 0.015;
          ctx.clearRect(0, 0, width, height);

          // Smooth mouse lerp
          mouseX += (targetMouseX - mouseX) * 0.05;
          mouseY += (targetMouseY - mouseY) * 0.05;

          // ─── 1. Flowing 3D Energy Waves (Sine Ribbons) ─────────────────────
          const waves = [
            { freq: 0.0025, speed: 0.02, amp: 45, yOffset: height * 0.62, color: 'rgba(249, 115, 22, 0.22)', width: 3 },
            { freq: 0.0035, speed: 0.025, amp: 65, yOffset: height * 0.68, color: 'rgba(234, 88, 12, 0.18)', width: 2.5 },
            { freq: 0.002, speed: 0.015, amp: 35, yOffset: height * 0.56, color: 'rgba(245, 158, 11, 0.25)', width: 2 },
            { freq: 0.004, speed: 0.03, amp: 50, yOffset: height * 0.74, color: 'rgba(251, 146, 60, 0.15)', width: 1.5 }
          ];

          waves.forEach((w) => {
            ctx.beginPath();
            for (let x = 0; x <= width; x += 6) {
              const mouseDist = Math.abs(x - mouseX);
              const mouseLift = mouseDist < 250 ? (1 - mouseDist / 250) * 20 : 0;
              const y = w.yOffset + Math.sin(x * w.freq + step * w.speed * 100) * w.amp - mouseLift;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = w.color;
            ctx.lineWidth = w.width;
            ctx.stroke();
          });

          // ─── 2. Interactive Constellation Nodes ───────────────────────────
          for (let i = 0; i < numNodes; i++) {
            const n = nodes[i];
            n.x += n.vx;
            n.y += n.vy;

            if (n.x < 0) n.x = width;
            if (n.x > width) n.x = 0;
            if (n.y < 0) n.y = height;
            if (n.y > height) n.y = 0;

            // Mouse interaction push
            const dxM = n.x - mouseX;
            const dyM = n.y - mouseY;
            const distM = Math.sqrt(dxM * dxM + dyM * dyM);
            if (distM < 160) {
              const force = (1 - distM / 160) * 1.5;
              n.x += (dxM / distM) * force;
              n.y += (dyM / distM) * force;
            }

            ctx.beginPath();
            ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${n.color}, ${n.baseAlpha})`;
            ctx.fill();

            // Connect nearby nodes with glowing energy lines
            for (let j = i + 1; j < numNodes; j++) {
              const n2 = nodes[j];
              const dx = n.x - n2.x;
              const dy = n.y - n2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 135) {
                ctx.beginPath();
                ctx.moveTo(n.x, n.y);
                ctx.lineTo(n2.x, n2.y);
                const lineAlpha = (1 - dist / 135) * 0.35;
                ctx.strokeStyle = `rgba(249, 115, 22, ${lineAlpha})`;
                ctx.lineWidth = 1;
                ctx.stroke();
              }
            }
          }

          animId = requestAnimationFrame(draw);
        };
        draw();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
        };
      }, []);

      return (
        <div className="absolute inset-0 overflow-hidden pointer-events-none">
          {/* Glowing Horizon Pulse Orb */}
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[650px] h-[380px] bg-gradient-to-r from-ember-500/20 via-amber-500/25 to-orange-500/20 rounded-full blur-[100px] animate-ember-aura"></div>

          {/* 3D Flowing Energy Waves & Constellation Canvas */}
          <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" />

          {/* Cyber Perspective Grid Overlay with Radial Vignette */}
          <div className="brik-grid-bg absolute inset-0 opacity-25 [mask-image:radial-gradient(ellipse_at_center,white,transparent_80%)]"></div>
          <div className="absolute inset-0 bg-gradient-to-b from-slate-950/60 via-transparent to-slate-950/90"></div>
        </div>
      );
    }

    // Auto-Scrolling Client Reviews Showcase (Continuous Floating & Interactive)
    // =========================================================================
    function HomeReviewsShowcase() {
      const row1 = HOME_CLIENT_REVIEWS.slice(0, 5);
      const row2 = HOME_CLIENT_REVIEWS.slice(5, 10);

      // Repeat items to ensure seamless infinite circular scrolling
      const track1 = [...row1, ...row1, ...row1, ...row1, ...row1, ...row1];
      const track2 = [...row2, ...row2, ...row2, ...row2, ...row2, ...row2];

      const track1Ref = useRef(null);
      const track2Ref = useRef(null);
      const speedRef = useRef(1);
      const targetSpeedRef = useRef(1);

      useEffect(() => {
        let animId;
        let pos1 = 0;
        let pos2 = 0;

        // Initialize track2 scrolled ahead
        if (track2Ref.current) {
          pos2 = track2Ref.current.scrollWidth / 3;
          track2Ref.current.scrollLeft = pos2;
        }

        const tick = () => {
          // Smoothly interpolate speed towards target
          speedRef.current += (targetSpeedRef.current - speedRef.current) * 0.08;
          const currentSpeed = speedRef.current;

          // Track 1: Continuous scroll left
          if (track1Ref.current) {
            pos1 += 1.1 * currentSpeed;
            const halfScroll = track1Ref.current.scrollWidth / 2;
            if (pos1 >= halfScroll) {
              pos1 = 0;
            }
            track1Ref.current.scrollLeft = pos1;
          }

          // Track 2: Continuous scroll right (reverse)
          if (track2Ref.current) {
            pos2 -= 0.95 * currentSpeed;
            const halfScroll2 = track2Ref.current.scrollWidth / 2;
            if (pos2 <= 0) {
              pos2 = halfScroll2;
            }
            track2Ref.current.scrollLeft = pos2;
          }

          animId = requestAnimationFrame(tick);
        };

        animId = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(animId);
      }, []);

      const handleMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const relativeX = (e.clientX - rect.left) / rect.width; // 0 (left) to 1 (right)
        // Moving cursor closer adjusts interactive speed dynamically
        targetSpeedRef.current = 0.5 + relativeX * 2.0;
      };

      const handleMouseLeave = () => {
        targetSpeedRef.current = 1.0;
      };

      const renderSimpleReviewCard = (rev, idx) => (
        <div
          key={`${rev.id}-${idx}`}
          className={`shrink-0 w-[290px] sm:w-[350px] p-5 rounded-2xl border border-slate-200/90 bg-white shadow-sm review-card-interactive review-float-${idx % 5} mx-3 flex flex-col justify-between select-none cursor-grab active:cursor-grabbing`}

                  ))}

              <span className="text-[11px] font-bold text-slate-500 font-mono bg-slate-100 px-2 py-0.5 rounded-md">5.0 ★</span>
            </div>

          className="relative overflow-hidden py-16 sm:py-24 bg-slate-50/70 border-y border-slate-200/80 reveal-section"

            <div

              style={{ scrollBehavior: 'auto', WebkitOverflowScrolling: 'touch' }}

                {track2.map((rev, idx) => renderSimpleReviewCard(rev, idx))}

    }

    function InteractiveIsoCard({ number, tag, title, description, bullets, children, accentColor = "#059669", delayClass = "" }) {
      const [tilt, setTilt] = useState({ x: 0, y: 0, active: false });
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotX = -((y - centerY) / centerY) * 6.5;
        const rotY = ((x - centerX) / centerX) * 6.5;
        setTilt({ x: rotX, y: rotY, active: true });
        setMousePos({ x, y });
      };

      const handleMouseLeave = () => {
        setTilt({ x: 0, y: 0, active: false });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          className={`group relative flex flex-col justify-between overflow-hidden rounded-3xl border border-slate-200/90 bg-white p-6 shadow-sm hover:shadow-xl transition-all duration-300 select-none cursor-default h-full`}
          style={{
            transform: tilt.active 
              ? `perspective(1000px) rotateX(${tilt.x.toFixed(2)}deg) rotateY(${tilt.y.toFixed(2)}deg) translateY(-8px) scale(1.02)` 
              : undefined,
            transition: tilt.active ? 'transform 0.12s ease-out' : 'transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease',
            borderColor: tilt.active ? accentColor : undefined,
            boxShadow: tilt.active ? `0 20px 40px -15px ${accentColor}25` : undefined
          }}
        >
          {/* Dynamic Radial Spotlight Follower */}
          {tilt.active && (
            <div 
              className="pointer-events-none absolute inset-0 z-0 opacity-100 transition-opacity duration-300"
              style={{
                background: `radial-gradient(400px circle at ${mousePos.x}px ${mousePos.y}px, ${accentColor}12, transparent 70%)`
              }}
            />
          )}

          {/* Top Bar: Number & Monospace Tag */}
          <div className="relative z-10 flex items-center justify-between border-b border-slate-100 pb-3 mb-2">
            <span className="font-mono text-sm font-bold" style={{ color: accentColor }}>{number}</span>
            <span 
              className="rounded-full bg-slate-50 px-3 py-1 font-mono text-[10px] font-bold border tracking-wider"
              style={{ color: accentColor, borderColor: `${accentColor}35` }}
            >
              {tag}
            </span>
          </div>

          {/* Title */}
          <div className="relative z-10">
            <h3 className="text-xl font-bold text-slate-900 group-hover:text-ember-600 transition-colors">
              {title}
            </h3>
          </div>

          {/* 3D Isometric Visual Stage (Light slate gradient with subtle border) */}
          <div className="relative z-10 aspect-[16/10] w-full my-4 rounded-2xl overflow-hidden bg-gradient-to-b from-slate-50 via-slate-50/80 to-slate-100/70 border border-slate-200/80 shadow-inner flex items-center justify-center">
            {children}
          </div>

          {/* Actionable Bullets — visual-first, no description paragraph */}
          <div className="relative z-10 border-t border-slate-100 pt-3.5 space-y-2 text-[11px] sm:text-xs text-slate-700 font-medium mt-auto">

                <span>{b.text}</span>
