  <script id="brik-page-navigation">
    (function () {
      const context = window.__BRIK_PAGE__;
      const local = window.location.protocol === 'file:';
      const source = local && window.location.pathname.includes('/pages/');
      const depth = source ? context.sourceDepth : context.outputDepth;
      const root = local ? new URL('../'.repeat(depth), window.location.href) : new URL('/', window.location.origin);
      const base = document.createElement('base');
      base.href = root.href;
      document.head.appendChild(base);
      const routes = new Set(["/","/services","/work","/about","/contact","/confirmation","/login","/services/web-design","/services/missed-call-text-back","/services/review-automation","/services/business-automation","/services/local-seo","/services/client-portal","/portal","/portal/bookings","/portal/leads","/portal/jobs","/portal/customers","/portal/reviews","/portal/automations","/portal/settings","/admin"]);
      window.siteHref = function (value) {
        if (typeof value !== 'string' || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(value)) return value;
        let route = value.startsWith('#/') ? value.slice(1) : value;
        route = route.replace(/\/$/, '') || '/';
        if (!routes.has(route)) return value;
        if (!local) return route === '/' ? root.href : new URL(route.slice(1) + '/', root).href;
        const file = route === '/' ? 'index.html' : (source || !window.location.pathname.includes('/dist/') ? 'pages/' : '') + route.slice(1) + '/index.html';
        return new URL(file, root).href;
      };
      window.navigateTo = function (route) { window.location.assign(window.siteHref(route)); };
      if (window.location.hash.startsWith('#/') && routes.has(window.location.hash.slice(1))) window.location.replace(window.siteHref(window.location.hash));
      document.addEventListener('DOMContentLoaded', function () {
        if (!local) return;
        document.querySelectorAll('link[rel*="icon"]').forEach(function (link) {
          const name = link.getAttribute('href');
          if (name && name.startsWith('/')) link.href = new URL((window.location.pathname.includes('/dist/') ? '' : 'public/') + name.slice(1), root).href;
        });
      });
    })();
  </script>

  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Inter', sans-serif;
    }
    .brik-grid-bg {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(226, 232, 240, 0.6) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.6) 1px, transparent 1px);
    }
    /* Silky Smooth Page Transitions */
    @keyframes pageFadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.995);
        filter: blur(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }
    @keyframes pageFadeOut {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
      to {
        opacity: 0;
        transform: translateY(-16px) scale(0.995);
        filter: blur(3px);
      }
    }
    .page-enter {
      animation: pageFadeInUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    .page-exit {
      animation: pageFadeOut 0.3s cubic-bezier(0.55, 0, 1, 0.45) both;
      pointer-events: none;
    }

    /* Staggered child fade-in for sections */
    @keyframes staggerFadeIn {
      from {
        opacity: 0;
        transform: translateY(32px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .stagger-children > * {
      opacity: 0;
      animation: staggerFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .stagger-children > *:nth-child(1) { animation-delay: 0.05s; }
    .stagger-children > *:nth-child(2) { animation-delay: 0.12s; }
    .stagger-children > *:nth-child(3) { animation-delay: 0.19s; }
    .stagger-children > *:nth-child(4) { animation-delay: 0.26s; }
    .stagger-children > *:nth-child(5) { animation-delay: 0.33s; }
    .stagger-children > *:nth-child(6) { animation-delay: 0.40s; }
    .stagger-children > *:nth-child(7) { animation-delay: 0.47s; }
    .stagger-children > *:nth-child(8) { animation-delay: 0.54s; }

    /* Animate-in-up util */
    .animate-in-up {
      animation: staggerFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* =====================================================
       WORD-BY-WORD BRICK DROP & DUST IMPACT ANIMATIONS
       ===================================================== */
    @keyframes brikHeavyWordDrop {
      0% {
        opacity: 0;
        transform: translateY(-65px) scale(1.06) rotateX(18deg);
        filter: blur(5px);
      }
      50% {
        opacity: 1;
        transform: translateY(6px) scale(0.985) rotateX(-1.5deg);
        filter: blur(0);
      }
      73% {
        transform: translateY(-2.5px) scale(1.004) rotateX(0.5deg);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotateX(0deg);
        filter: blur(0);
      }
    }

    @keyframes brikDustImpact {
      0% {
        opacity: 0;
        transform: translateX(-50%) scaleX(0.2) scaleY(0.4) translateY(0);
        filter: blur(2px);
      }
      30% {
        opacity: 0.85;
        transform: translateX(-50%) scaleX(1.15) scaleY(1.3) translateY(-4px);
        filter: blur(4px);
      }
      70% {
        opacity: 0.45;
        transform: translateX(-50%) scaleX(1.85) scaleY(1.7) translateY(-10px);
        filter: blur(8px);
      }
      100% {
        opacity: 0;
        transform: translateX(-50%) scaleX(2.5) scaleY(2.2) translateY(-16px);
        filter: blur(14px);
      }
    }

    @keyframes brikElementFadeUp {
      0% {
        opacity: 0;
        transform: translateY(22px);
        filter: blur(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes brikDashAssembly {
      0% {
        opacity: 0;
        transform: translateY(-95px) scale(0.88) rotate(-1.5deg);
        filter: blur(10px);
      }
      65% {
        opacity: 1;
        transform: translateY(8px) scale(1.02) rotate(0.5deg);
        filter: blur(0);
      }
      85% {
        transform: translateY(-3px) scale(0.995);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0deg);
      }
    }

    @keyframes brikTileSnap {
      0% {
        opacity: 0;
        transform: translateY(-35px) scale(0.85);
      }
      70% {
        opacity: 1;
        transform: translateY(4px) scale(1.03);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Word-by-word dropping classes (Snappy Brick-by-Brick Drop) */
    .brik-word-pill {
      animation: brikElementFadeUp 0.50s cubic-bezier(0.16, 1, 0.3, 1) 0.10s both;
    }

    .brik-word-1 {
      animation: brikHeavyWordDrop 0.58s cubic-bezier(0.22, 1, 0.36, 1) 0.22s both;
    }
    .brik-word-2 {
      animation: brikHeavyWordDrop 0.58s cubic-bezier(0.22, 1, 0.36, 1) 0.38s both;
    }
    .brik-word-3 {
      animation: brikHeavyWordDrop 0.58s cubic-bezier(0.22, 1, 0.36, 1) 0.54s both;
    }
    .brik-word-4 {
      animation: brikHeavyWordDrop 0.60s cubic-bezier(0.22, 1, 0.36, 1) 0.72s both;
    }
    .brik-word-5 {
      animation: brikHeavyWordDrop 0.60s cubic-bezier(0.22, 1, 0.36, 1) 0.90s both;
    }

    /* Dust Impact shockwaves on impact */
    .brik-dust-wave {
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 110%;
      height: 14px;
      background: radial-gradient(ellipse at center, rgba(249, 115, 22, 0.45) 0%, rgba(203, 213, 225, 0.55) 45%, rgba(148, 163, 184, 0) 80%);
      border-radius: 9999px;
      pointer-events: none;
      opacity: 0;
    }

    .brik-dust-1 { animation: brikDustImpact 0.58s ease-out 0.52s both; }
    .brik-dust-2 { animation: brikDustImpact 0.58s ease-out 0.68s both; }
    .brik-dust-3 { animation: brikDustImpact 0.58s ease-out 0.84s both; }
    .brik-dust-4 { animation: brikDustImpact 0.58s ease-out 1.02s both; }
    .brik-dust-5 { animation: brikDustImpact 0.58s ease-out 1.20s both; }

    /* Trailing Hero elements */
    .brik-desc-drop {
      animation: brikElementFadeUp 0.58s cubic-bezier(0.16, 1, 0.3, 1) 1.25s both;
    }
    .brik-cta-drop {
      animation: brikElementFadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) 1.60s both;
    }
    .brik-trust-drop {
      animation: brikElementFadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) 1.75s both;
    }

    /* =====================================================
       MONITOR SHOWCASE SCROLL-REVEAL ANIMATIONS
       Three monitors rise up from below with staggered timing.
       ===================================================== */
    @keyframes monitorRiseLeft {
      0%   { opacity: 0; transform: rotateY(16deg) scale(0.78) translateY(130px) translateX(-35px); filter: blur(20px) brightness(0.15); }
      52%  { opacity: 1; transform: rotateY(16deg) scale(0.985) translateY(-6px) translateX(0); filter: blur(0) brightness(1); }
      72%  { transform: rotateY(16deg) scale(0.962) translateY(2px); }
      100% { opacity: 1; transform: rotateY(16deg) scale(0.97) translateY(0) translateX(0); filter: blur(0) brightness(1); }
    }
    @keyframes monitorRiseRight {
      0%   { opacity: 0; transform: rotateY(-16deg) scale(0.78) translateY(130px) translateX(35px); filter: blur(20px) brightness(0.15); }
      52%  { opacity: 1; transform: rotateY(-16deg) scale(0.985) translateY(-6px) translateX(0); filter: blur(0) brightness(1); }
      72%  { transform: rotateY(-16deg) scale(0.962) translateY(2px); }
      100% { opacity: 1; transform: rotateY(-16deg) scale(0.97) translateY(0) translateX(0); filter: blur(0) brightness(1); }
    }
    @keyframes monitorRiseCenter {
      0%   { opacity: 0; transform: translateX(-50%) translateZ(40px) scale(0.76) translateY(120px); filter: blur(24px) brightness(0.12); }
      52%  { opacity: 1; transform: translateX(-50%) translateZ(40px) scale(1.055) translateY(-8px); filter: blur(0) brightness(1); }
      72%  { transform: translateX(-50%) translateZ(40px) scale(1.025) translateY(2px); }
      100% { opacity: 1; transform: translateX(-50%) translateZ(40px) scale(1.04) translateY(0); filter: blur(0) brightness(1); }
    }
    @keyframes glowPulseIn {
      0%   { opacity: 0; transform: scaleX(0.2) scaleY(0.1); }
      65%  { opacity: 1; transform: scaleX(1.1) scaleY(1.1); }
      100% { opacity: 0.9; transform: scaleX(1) scaleY(1); }
    }

    @keyframes cardContinuousGlide {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    /* Monitor stage: pure CSS auto-animations, no JS needed */
    /* Left and Right appear first (after trust badges at 1.75s), center rises last */
    .brik-cta-drop {
      animation: brikElementFadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) 1.25s both;
    }
    .brik-trust-drop {
      animation: brikElementFadeUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) 1.40s both;
    }

    .mon-left {
      opacity: 0;
      animation: monitorRiseLeft 1.05s cubic-bezier(0.16, 1, 0.3, 1) 1.30s both;
    }
    .mon-right {
      opacity: 0;
      animation: monitorRiseRight 1.05s cubic-bezier(0.16, 1, 0.3, 1) 1.45s both;
    }
    .mon-center {
      opacity: 0;
      animation: monitorRiseCenter 1.20s cubic-bezier(0.16, 1, 0.3, 1) 1.60s both;
    }
    .mon-glow {
      opacity: 0;
      animation: glowPulseIn 1.6s cubic-bezier(0.16, 1, 0.3, 1) 1.85s both;
    }

    /* =====================================================
       4-CORNER DASHBOARD ASSEMBLY ANIMATION
       ===================================================== */
    @keyframes brikCornerTL {

      filter: blur(8px);
      transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1), transform 0.95s cubic-bezier(0.16, 1, 0.3, 1), filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }
    .reveal-section.is-visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }
    /* Showcase Progress Bar Animation */
    @keyframes showcase-progress {
      from { width: 0%; }
      to   { width: 100%; }
    }
    /* Left Box: Slices in powerfully from far left with deep perspective rotation */
    .reveal-left {
      opacity: 0;
      transform: perspective(1400px) translateX(-240px) translateZ(-80px) rotateY(24deg) scale(0.85);
      filter: blur(12px);
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.25s cubic-bezier(0.16, 1, 0.3, 1), filter 1s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }
    .reveal-left.is-visible {
      opacity: 1;
      transform: perspective(1400px) translateX(0) translateZ(0) rotateY(0deg) scale(1);
      filter: blur(0px);
    }

    /* Right Box: Slices in powerfully from far right with mirror rotation */
    .reveal-right {
      opacity: 0;
      transform: perspective(1400px) translateX(240px) translateZ(-80px) rotateY(-24deg) scale(0.85);
      filter: blur(12px);
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.25s cubic-bezier(0.16, 1, 0.3, 1), filter 1s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }
    .reveal-right.is-visible {
      opacity: 1;
      transform: perspective(1400px) translateX(0) translateZ(0) rotateY(0deg) scale(1);
      filter: blur(0px);
    }

    /* Center Box: Rises boldly up with deep 3D uncurl */
    .reveal-card {
      opacity: 0;
      transform: perspective(1400px) translateY(120px) translateZ(-60px) rotateX(18deg) scale(0.88);
      filter: blur(12px);
      transition: opacity 1.1s cubic-bezier(0.16, 1, 0.3, 1), transform 1.25s cubic-bezier(0.16, 1, 0.3, 1), filter 1s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }
    .reveal-card.is-visible {
      opacity: 1;
      transform: perspective(1400px) translateY(0) translateZ(0) rotateX(0deg) scale(1);
      filter: blur(0px);
    }
    /* Reveal with 3D scale spring */
    .reveal-scale {
      opacity: 0;
      transform: scale(0.88) translateY(50px);
      filter: blur(10px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1), filter 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform, filter;
    }
    .reveal-scale.is-visible {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0px);
    }
    /* Precise stagger timing for fluid cascade */
    .reveal-stagger-1 { transition-delay: 0.12s !important; }
    .reveal-stagger-2 { transition-delay: 0.26s !important; }
    .reveal-stagger-3 { transition-delay: 0.40s !important; }
    .reveal-stagger-4 { transition-delay: 0.54s !important; }
    .reveal-stagger-5 { transition-delay: 0.68s !important; }
    .reveal-stagger-6 { transition-delay: 0.82s !important; }

    /* Isometric modules continuous animation keyframes */
    @keyframes brikIsoFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes brikIsoFloatDelayed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .anim-iso-float { animation: brikIsoFloat 3.8s ease-in-out infinite; }
    .anim-iso-float-delayed { animation: brikIsoFloatDelayed 4.2s ease-in-out infinite 0.8s; }

    /* =====================================================
       SERVICES PAGE DYNAMIC CASCADE & TACTILE ENTRANCES
       ===================================================== */
    @keyframes serviceHeroRise {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.96);
        filter: blur(6px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    @keyframes serviceCardCascade {
      0% {
        opacity: 0;
        transform: perspective(800px) translateY(50px) rotateX(12deg) scale(0.92);
        filter: blur(4px);
      }
      70% {
        opacity: 1;
        transform: perspective(800px) translateY(-4px) rotateX(-2deg) scale(1.01);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: perspective(800px) translateY(0) rotateX(0deg) scale(1);
      }
    }

    .service-hero-badge {
      animation: brikHeavyWordDrop 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.25) 0.1s both;
    }
    .service-hero-title {
      animation: serviceHeroRise 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
    }
    .service-hero-desc {
      animation: serviceHeroRise 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }
    .service-hero-cta {
      animation: serviceHeroRise 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
    }

    @keyframes serviceAllCardsEntry {
      0% {
        opacity: 0;
        transform: perspective(1000px) translateY(35px) scale(0.96);
        filter: blur(5px);
      }
      70% {
        opacity: 1;
        transform: perspective(1000px) translateY(-3px) scale(1.008);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: perspective(1000px) translateY(0) scale(1);
      }
    }

    .service-card-anim {
      animation: serviceAllCardsEntry 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
    }

    /* =====================================================
       SERVICE SUBPAGE EMBER HERO ANIMATIONS
       ===================================================== */
    @keyframes svcHeroTitleReveal {
      0% {
        opacity: 0;
        transform: translateY(60px) skewY(2deg);
        filter: blur(4px);
      }
      60% {
        opacity: 1;
        transform: translateY(-4px) skewY(0deg);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: translateY(0) skewY(0deg);
      }
    }
    @keyframes svcUnderlineGrow {
      0% { width: 0%; opacity: 0; }
      60% { opacity: 1; }
      100% { width: 100%; opacity: 1; }
    }
    @keyframes svcStatCardPop {
      0% { opacity: 0; transform: translateY(24px) scale(0.92); }
      70% { transform: translateY(-3px) scale(1.02); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes svcTextFadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .svc-hero-title {
      animation: svcHeroTitleReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }
    .svc-underline-anim {
      animation: svcUnderlineGrow 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s both;
      width: 0;
    }
    .svc-desc-anim {
      animation: svcTextFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both;
    }
    .svc-cta-anim {
      animation: svcTextFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
    }
    .svc-stat-card-anim {
      animation: svcStatCardPop 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both;
    }
    .svc-breadcrumb-anim {
      animation: svcTextFadeUp 0.5s ease 0.05s both;
    }

    /* =====================================================
       BUTTON MICRO-INTERACTIONS
       ===================================================== */
    /* Universal smooth button transition */
    a[href], button {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Primary CTA glow on hover */
    .cta-glow {
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cta-glow:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 8px 30px -4px rgba(249, 115, 22, 0.4), 0 0 0 1px rgba(249, 115, 22, 0.15);
    }
    .cta-glow:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 2px 10px -2px rgba(249, 115, 22, 0.3);
    }
    /* Ghost/outline button hover */
    .btn-ghost {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-ghost:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px -3px rgba(15, 23, 42, 0.1);
    }
    .btn-ghost:active {
      transform: translateY(0) scale(0.97);
    }

    /* =====================================================
       LINK / NAV ITEM UNDERLINE SLIDE
       ===================================================== */
    .nav-link-anim {
      position: relative;
    }
    .nav-link-anim::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #f97316, #ea580c);
      border-radius: 2px;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1), left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .nav-link-anim:hover::after,
    .nav-link-anim.active::after {
      width: 70%;
      left: 15%;
    }

    /* =====================================================
       SMOOTH IMAGE / CARD SCALE ON HOVER
       ===================================================== */
    .hover-lift {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hover-lift:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.12);
    }

    /* =====================================================
       TEXT GRADIENT SHIMMER
       ===================================================== */
    @keyframes gradientShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .text-shimmer {
      background: linear-gradient(90deg, #f97316, #ea580c, #f97316);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShimmer 4s ease infinite;
    }

    /* =====================================================
       SMOOTH ACCORDION / COLLAPSE
       ===================================================== */
    .smooth-collapse {
      overflow: hidden;
      transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }
    @keyframes shineEffect {
      0% { transform: translateX(-120%) rotate(25deg); }
      100% { transform: translateX(240%) rotate(25deg); }
    }
    .btn-shine {
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-shine::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        60deg,
        transparent 35%,
        rgba(255, 255, 255, 0.35) 50%,
        transparent 65%
      );
      transform: translateX(-120%) rotate(25deg);
      pointer-events: none;
    }
    .btn-shine:hover::after {
      animation: shineEffect 0.8s ease-out;
    }
    .btn-shine:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.3);
    }
    .btn-shine:active {
      transform: translateY(0) scale(0.98);
    }
    /* Ambient Floating Gradient Orbs */
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(25px, -20px) scale(1.06); }
      66% { transform: translate(-15px, 15px) scale(0.96); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      33% { transform: translate(-25px, 20px) scale(0.94); }
      66% { transform: translate(20px, -15px) scale(1.05); }
    }
    .animate-orb-1 {
      animation: floatOrb1 14s ease-in-out infinite;
    }
    .animate-orb-2 {
      animation: floatOrb2 18s ease-in-out infinite;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .animate-float-gentle {
      animation: floatSlow 4s ease-in-out infinite;
    }
    @keyframes livePulseDot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }
    .animate-live-dot {
      animation: livePulseDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    /* Seamless Continuous Live Scroll for Portfolio Previews */
    @keyframes liveScrollContinuous {
      0% {
        transform: translateY(0%);
      }
      50% {
        transform: translateY(-55%);
      }
      100% {
        transform: translateY(0%);
      }
    }
    .animate-live-scroll {
      animation: liveScrollContinuous 14s ease-in-out infinite;
      will-change: transform;
    }

    /* Continuous Reviews Float & Interactive Animations */
    @keyframes reviewFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes reviewFloat2 {
      0%, 100% { transform: translateY(-6px); }
      50% { transform: translateY(4px); }
    }
    @keyframes reviewFloat3 {
      0%, 100% { transform: translateY(3px); }
      50% { transform: translateY(-5px); }
    }
    .review-float-0 { animation: reviewFloat1 4.2s ease-in-out infinite; }
    .review-float-1 { animation: reviewFloat2 3.8s ease-in-out infinite 0.6s; }
    .review-float-2 { animation: reviewFloat3 4.6s ease-in-out infinite 1.2s; }
    .review-float-3 { animation: reviewFloat1 4.0s ease-in-out infinite 1.8s; }
    .review-float-4 { animation: reviewFloat2 4.4s ease-in-out infinite 2.4s; }

    .review-card-interactive {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
      will-change: transform;
    }
    .review-card-interactive:hover {
      transform: translateY(-10px) scale(1.04) !important;
      box-shadow: 0 20px 35px -8px rgba(15, 23, 42, 0.12), 0 0 20px 2px rgba(249, 115, 22, 0.18) !important;
      border-color: rgba(249, 115, 22, 0.5) !important;
      z-index: 20;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Interactive Card Glow & Sheen */
    .card-interactive {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease;
    }
    .card-interactive:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.08), 0 0 25px -5px rgba(249, 115, 22, 0.12);
    }
    @keyframes glassSweep {
      0% { transform: translateX(-150%) skewX(-20deg); }
      40%, 100% { transform: translateX(250%) skewX(-20deg); }
    }
    .glass-card-sheen {
      position: relative;
      overflow: hidden;
    }
    .glass-card-sheen::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.18),
        transparent
      );
      transform: translateX(-150%) skewX(-20deg);
      pointer-events: none;
      z-index: 15;
    }
    .glass-card-sheen:hover::before {
      animation: glassSweep 1.2s ease-in-out;
    }
    /* Completely hide scrollbars across all browsers */
    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    html, body {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    /* =====================================================
       PERMANENT STICKY HEADER (Always Accessible)
       ===================================================== */
    .header-permanent {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      transform: translateY(0) !important;
    }
    /* Timeline Flowing Beam */
    @keyframes timelineBeam {
      0% { transform: translateY(-100%); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(800%); opacity: 0; }
    }
    .animate-timeline-beam {
      animation: timelineBeam 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    /* Glow Pulse Effects */
    @keyframes glowRingPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
    }
    .animate-glow-ring {
      animation: glowRingPulse 2.5s ease-in-out infinite;
    }
    /* =====================================================
       LIGHTWEIGHT CARD HOVER (Zero-Lag, Hardware-Accelerated)
       ===================================================== */
    .tilt-card {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
      will-change: transform;
    }
    .tilt-card:hover {
      transform: translateY(-4px);
    }
    /* =====================================================
       MAGNETIC BUTTON
       ===================================================== */
    .magnetic-btn {
      display: inline-flex;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* =====================================================
       TECH SCANLINE & SOFTWARE CYBER HUD ANIMATION
       ===================================================== */
    @keyframes techScanline {
      0% { top: -2%; opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { top: 98%; opacity: 0; }
    }
    .animate-tech-scan {
      animation: techScanline 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* =====================================================
       3 CURVED APPLE MONITORS SHOWCASE (HERO SECTION)
       ===================================================== */
    @keyframes heroMonitorScrollCenter {
      0%, 15% { transform: translateY(0); }
      50%, 65% { transform: translateY(-44%); }
      88%, 100% { transform: translateY(0); }
    }
    @keyframes heroMonitorScrollLeft {
      0%, 14% { transform: translateY(-13%); }
      48%, 62% { transform: translateY(-50%); }
      86%, 100% { transform: translateY(-13%); }
    }
    @keyframes heroMonitorScrollRight {
      0%, 16% { transform: translateY(0); }
      52%, 66% { transform: translateY(-42%); }
      90%, 100% { transform: translateY(0); }
    }
    .animate-monitor-scroll-center {
      animation: heroMonitorScrollCenter 15s ease-in-out infinite;
    }
    .animate-monitor-scroll-left {
      animation: heroMonitorScrollLeft 17s ease-in-out infinite;
    }
    .animate-monitor-scroll-right {
      animation: heroMonitorScrollRight 16s ease-in-out infinite;
    }
    .hero-monitors-container:hover .animate-monitor-scroll-center,
    .hero-monitors-container:hover .animate-monitor-scroll-left,
    .hero-monitors-container:hover .animate-monitor-scroll-right {
      animation-play-state: paused;
    }


    /* The first screen reserves separate rows for copy and the complete monitors. */
    .brik-home-hero {
      height: calc(100vh - 4rem);
      height: calc(100svh - 4rem);
      min-height: 440px;
      display: grid;
      grid-template-rows: max-content minmax(0, 1fr);
      row-gap: clamp(12px, 2svh, 22px);
      padding-bottom: clamp(12px, 2svh, 22px);
    }
    .brik-home-hero .hero-copy { padding-top: clamp(12px, 2svh, 20px); }
    .brik-home-hero .hero-title {
      font-size: clamp(32px, min(5.2vw, 8.4svh), 68px);
      line-height: 1.04;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.04em;
      white-space: nowrap;
    }
    .brik-home-hero .hero-actions { margin-top: clamp(12px, 2.5svh, 22px); }
    .brik-home-hero .hero-trust { margin-top: 12px; }
    .brik-home-hero .hero-showcase,
    .brik-home-hero .hero-monitors-container,
    .brik-home-hero .hero-monitor-stage { height: 100%; min-height: 0; }
    .brik-home-hero .hero-monitor-side { height: min(calc(88% - 12px), 34vw); }
    .brik-home-hero .hero-monitor-center { height: min(calc(100% - 12px), 38vw); }
    .brik-home-hero .hero-monitor-stage > a:focus-visible {
      outline: 3px solid #e87930;
      outline-offset: 5px;
      border-radius: 8px;
    }
    @media (max-width: 767px) {
      .brik-home-hero {
        height: auto;
        min-height: 0;
        grid-template-rows: max-content auto;
        row-gap: 18px;
        padding-bottom: 24px;
      }
      .brik-home-hero .hero-copy { padding-top: 20px; }
      .brik-home-hero .hero-title { font-size: clamp(30px, 8vw, 48px); }
      .brik-home-hero .hero-showcase { height: min(56vw, 320px); }
      .brik-home-hero .hero-monitor-side { height: min(calc(88% - 12px), 42vw); }
      .brik-home-hero .hero-monitor-center { height: min(calc(100% - 12px), 48vw); }
    }

    .brik-home-hero .hero-title-part {
      display: inline-flex;
      align-items: baseline;
      gap: 0.25em;
    }
    .brik-home-hero .hero-ambient {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    }
    .hero-ambient-glow {
      position: absolute; width: clamp(260px, 34vw, 520px); aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle, rgba(234,124,52,0.22), rgba(251,191,110,0.08) 44%, transparent 72%);
      animation: heroAmbientDrift 16s ease-in-out infinite alternate;
    }
    .hero-ambient-left { left: -12%; top: 10%; }
    .hero-ambient-right { right: -11%; top: 6%; animation-delay: -8s; }
    .hero-cursor-glow {
      position: absolute; top: 0; left: 0; width: 440px; height: 440px; border-radius: 50%;
      background: radial-gradient(circle, rgba(244,155,66,0.24), rgba(238,132,54,0.1) 36%, transparent 70%);
      transform: translate3d(var(--glow-x, -500px), var(--glow-y, -500px), 0);
      opacity: var(--glow-opacity, 0); transition: opacity 450ms ease-out;
    }
    @keyframes heroAmbientDrift {
      from { transform: translate3d(0,-12px,0) scale(0.96); opacity: 0.7; }
      to { transform: translate3d(22px,25px,0) scale(1.06); opacity: 1; }

  <script>
    (function() {
      // ─── Section & Card Reveal on Scroll (IntersectionObserver) ─────────────
      function setupReveal() {
        var els = document.querySelectorAll('.reveal-section, .reveal-card, .reveal-left, .reveal-right, .reveal-scale');
        if (!els.length) return;
        
        if ('IntersectionObserver' in window) {
          var io = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                io.unobserve(entry.target);
              }
            });
          }, { 
            threshold: 0.08,
            rootMargin: '0px 0px -60px 0px'
          });

          els.forEach(function(el) {
            var rect = el.getBoundingClientRect();
            if (rect.top < window.innerHeight - 60 && rect.bottom > 0) {
              el.classList.add('is-visible');
            } else {
              io.observe(el);
            }
          });

          // Fluid scroll listener ensuring instantaneous silky entrance
          window.addEventListener('scroll', function() {
            var pending = document.querySelectorAll('.reveal-section:not(.is-visible), .reveal-card:not(.is-visible), .reveal-left:not(.is-visible), .reveal-right:not(.is-visible)');
            if (!pending.length) return;
            var vh = window.innerHeight;
            pending.forEach(function(el) {
              var r = el.getBoundingClientRect();
              if (r.top < vh - 60 && r.bottom > 0) {
                el.classList.add('is-visible');
              }
            });
          }, { passive: true });
        } else {
          els.forEach(function(el) { el.classList.add('is-visible'); });
        }
      }

      window.setupRevealFromReact = setupReveal;

      });

        setTimeout(setupReveal, 200);
      });

        setupReveal();

    function HomeClosingShowcase() {
      const rootRef = useRef(null);
      const [playing, setPlaying] = useState(false);
      const [paused, setPaused] = useState(false);
      const [mounted, setMounted] = useState(false);
      const previews = [
        {id:'apex', label:'Apex Motors', url:'https://autoshoo.vercel.app/'},
        {id:'velora', label:'Velora Grand', url:'https://veloragrand.vercel.app/'},
        {id:'luxurious', label:'Luxurious Painting', url:'https://luxuriouspainting.vercel.app/'}
      ];
      useEffect(() => {
        const root = rootRef.current;
        const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
        let near = false;
        const sync = () => setPlaying(near && !document.hidden && !preference.matches && !paused);
        const observer = new IntersectionObserver(entries => {
          near = entries[0].isIntersecting;
          if (near) setMounted(true);
          sync();
        }, {rootMargin:'120px 0px', threshold:0});
        const measure = () => root.querySelectorAll('.brik-closing-page').forEach(page => {
          page.style.setProperty('--preview-scale', String(page.clientWidth / 1280));
          page.style.setProperty('--preview-travel', (page.clientWidth * .42).toFixed(2) + 'px');
        });
        const resize = new ResizeObserver(measure);
        root.querySelectorAll('.brik-closing-page').forEach(page => resize.observe(page));
        measure();
        observer.observe(root);
        document.addEventListener('visibilitychange', sync);
        preference.addEventListener('change', sync);
        return () => {
          observer.disconnect();
          resize.disconnect();
          document.removeEventListener('visibilitychange', sync);
          preference.removeEventListener('change', sync);
        };
      }, [paused]);
      return (
        <section ref={rootRef} className="brik-closing-section" aria-labelledby="brik-closing-title">
          <div className="brik-closing-panel" data-playing={playing}>
            <div className="brik-closing-copy">
              <span className="brik-closing-eyebrow"><span></span> Your next chapter starts here</span>
              <h2 id="brik-closing-title">A better website.<br /><span>A bigger possibility.</span></h2>
              <p>Look good. Work smarter. Build a website and connected system that turns first impressions into your next customers.</p>
              <div className="brik-closing-actions">
                <a className="brik-closing-primary" href={siteHref('#/contact')}>Let's Build It <Icon name="arrow-right" className="h-4 w-4" /></a>
                <a className="brik-closing-secondary" href={siteHref('#/work')}>See Our Work <span aria-hidden="true">↗</span></a>
              </div>
              <span className="brik-closing-note">Websites + systems. Built to work together.</span>
            </div>
            <button type="button" className="brik-closing-playback" onClick={() => setPaused(value => !value)} aria-pressed={paused}>{paused ? 'Play previews' : 'Pause previews'} <span aria-hidden="true">{paused ? '▷' : 'Ⅱ'}</span></button>
            <div className="brik-closing-gallery" aria-hidden="true" inert="">
              <div className="brik-closing-orbit"></div>
              {previews.map((preview,index) => (
                <div key={preview.id} className={'brik-closing-browser brik-closing-browser-'+index}>
                  <div className="brik-closing-browserbar"><span><i></i><i></i><i></i></span><b>{preview.label}</b><span>↗</span></div>

    function HomeMotionShell({children}) {
      const rootRef = useRef(null);
      React.useLayoutEffect(() => {
        const root = rootRef.current;
        const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
        const scenes = [...root.querySelectorAll('main > section')].filter(node=>!node.classList.contains('brik-home-hero')&&!node.classList.contains('brik-core-section'));
        const targets = new Set();
        let frame = 0;
        const mark = (node,kind,delay=0) => {
          if(!node || node.closest('.brik-home-hero,.brik-core-section') || targets.has(node))return;
          node.dataset.homeReveal=kind;
          node.dataset.homeVisible=String(preference.matches);
          node.style.setProperty('--home-delay',delay+'ms');
          targets.add(node);
        };
        const legacy = root.querySelectorAll('.reveal-section,.reveal-left,.reveal-right,.reveal-card,.reveal-scale');
        legacy.forEach(node=>node.classList.add('is-visible'));
        root.querySelectorAll('[data-home-motion]').forEach(node=>mark(node,node.dataset.homeMotion));
        root.querySelectorAll('.portal-demo-computer').forEach(node=>mark(node,'monitor'));
        root.querySelectorAll('.brik-stat').forEach((node,index)=>mark(node,'stat',index*90));
        mark(root.querySelector('main > section:last-child > div'),'close');
        scenes.forEach((scene,index)=>{
          scene.dataset.homeScene=String(index);
          scene.querySelectorAll('h2').forEach(heading=>{
            if(!heading.closest('[data-home-reveal]'))mark(heading.parentElement,'heading');
          });
          if(index===0)mark(scene.firstElementChild,'intro');
        });
        legacy.forEach(node=>{
          if(node.tagName==='SECTION'||node.closest('.brik-core-section')||node.querySelector('.portal-demo-computer')||node.closest('[data-home-reveal]'))return;
          const kind=node.classList.contains('reveal-left')?'left':node.classList.contains('reveal-right')?'right':node.classList.contains('reveal-scale')?'depth':'rise';
          const stagger=[...node.classList].find(name=>name.startsWith('reveal-stagger-'));
          mark(node,kind,stagger?(Number(stagger.split('-').pop())-1)*100:0);
        });
        const reviews=root.querySelector('[data-home-reviews]');
        if(reviews)mark(reviews.querySelector('[data-review-tracks]'),'reviews');
        mark(root.querySelector('footer'),'footer');
        const observer=new IntersectionObserver(entries=>{
          entries.forEach(entry=>{if(entry.isIntersecting){entry.target.dataset.homeVisible='true';observer.unobserve(entry.target);}});
        },{threshold:0.12,rootMargin:'0px 0px -4% 0px'});
        if(!preference.matches)targets.forEach(node=>observer.observe(node));
        const paintScroll=()=>{
          frame=0;
          const height=window.innerHeight;
          const distance=Math.max(1,document.documentElement.scrollHeight-height);
          root.style.setProperty('--home-progress',String(Math.max(0,Math.min(1,window.scrollY/distance))));
          if(preference.matches)return;
          scenes.forEach(scene=>{
            const rect=scene.getBoundingClientRect();
            if(rect.bottom<-120||rect.top>height+120)return;
            const position=Math.max(0,Math.min(1,(height-rect.top)/(height+rect.height)));
            scene.style.setProperty('--scene-shift',((position-0.5)*42).toFixed(2)+'px');
            scene.style.setProperty('--scene-progress',String(Math.max(0,Math.min(1,(height-rect.top)/(height*0.8)))));
          });
        };
        const schedule=()=>{if(!frame)frame=requestAnimationFrame(paintScroll);};
        const changed=()=>{
          root.dataset.reduced=String(preference.matches);
          if(preference.matches){
            observer.disconnect();
            targets.forEach(node=>node.dataset.homeVisible='true');
            scenes.forEach(scene=>scene.style.removeProperty('--scene-shift'));
          }
          schedule();
        };
        const focus=event=>{
          let node=event.target;
          while(node&&node!==root){
            if(targets.has(node)){node.dataset.homeVisible='true';observer.unobserve(node);}
            node=node.parentElement;
          }
        };
        const resize=new ResizeObserver(schedule);
        resize.observe(root);
        window.addEventListener('scroll',schedule,{passive:true});
        window.addEventListener('resize',schedule,{passive:true});
        root.addEventListener('focusin',focus);
        preference.addEventListener('change',changed);
        changed();
        return()=>{
          if(frame)cancelAnimationFrame(frame);
          observer.disconnect();resize.disconnect();
          window.removeEventListener('scroll',schedule);window.removeEventListener('resize',schedule);
          root.removeEventListener('focusin',focus);preference.removeEventListener('change',changed);
        };
      },[]);
      return <div ref={rootRef} className="brik-home-motion flex min-h-screen flex-col bg-white"><span className="brik-home-scroll-progress" aria-hidden="true"></span>{children}</div>;
    }

        {title:'Bookings',caption:'Make scheduling effortless',icon:'calendar',slug:'business-automation',side:'left',row:3},
        {title:'Reviews',caption:'Build trust after every job',icon:'message-square-quote',slug:'review-automation',side:'right',row:1},
        {title:'Automation',caption:'Keep the follow-up moving',icon:'settings',slug:'business-automation',side:'right',row:2},

      ];
      useEffect(() => {
        const section = sectionRef.current, diagram = diagramRef.current, svg = svgRef.current;

        let live = true, frame = 0, pendingPointer = null, previousCard = null;
        let entranceStarted = false;
        const phaseTimers = [];
        const drawConnections = () => {
          if (!live) return;
          const bounds = diagram.getBoundingClientRect(), core = logoRef.current.getBoundingClientRect();
          if (!bounds.width || !bounds.height) return;
          svg.setAttribute('viewBox', '0 0 ' + bounds.width + ' ' + bounds.height);
          cardRefs.current.forEach((card,index) => {
            const service = services[index];
            const sx = card.offsetLeft + (service.side === 'left' ? card.offsetWidth : 0);
            const sy = card.offsetTop + card.offsetHeight / 2;
            const ex = (service.side === 'left' ? core.left + 5 : core.right - 5) - bounds.left;
            const ey = core.top + core.height / 2 - bounds.top + (service.row - 2) * 48;
            const middle = (sx + ex) / 2;
            const path = 'M ' + sx + ' ' + sy + ' C ' + middle + ' ' + sy + ', ' + middle + ' ' + ey + ', ' + ex + ' ' + ey;
            const group = groupRefs.current[index];
            group.querySelectorAll('path').forEach(node => node.setAttribute('d',path));
            const port = group.querySelector('circle');
            port.setAttribute('cx',sx); port.setAttribute('cy',sy);
          });
        };
        const resize = new ResizeObserver(drawConnections);
        resize.observe(diagram);
        cardRefs.current.forEach(card => resize.observe(card));
        const finishEntrance = () => {
          if (section.dataset.phase === 'connected') return;
          entranceStarted = true;
          phaseTimers.forEach(clearTimeout);
          section.dataset.skipIntro = 'true';
          section.dataset.ready = 'true';
          section.dataset.phase = 'connected';
          drawConnections();
        };
        const startEntrance = () => {
          if (entranceStarted) return;
          if (reduced.matches) { finishEntrance(); return; }
          entranceStarted = true;
          drawConnections();
          section.dataset.phase = 'assembling';
          section.dataset.ready = 'true';
          phaseTimers.push(setTimeout(() => { if (live) section.dataset.phase = 'wiring'; },1550));
          phaseTimers.push(setTimeout(() => { if (live) section.dataset.phase = 'connected'; },2850));
        };
        const reveal = new IntersectionObserver(([entry]) => {
          section.dataset.visible = String(entry.isIntersecting);
        }, {threshold:0.05});
        const entrance = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) { startEntrance(); entrance.disconnect(); }
        }, {threshold:0.24});
        reveal.observe(section);
        entrance.observe(diagram);
        const resetCard = card => {
          if (!card) return;
          ['--card-rx','--card-ry','--card-light-x','--card-light-y'].forEach(name => card.style.removeProperty(name));
        };
        const resetPointer = () => {
          if (frame) cancelAnimationFrame(frame);
          frame = 0;
          section.style.removeProperty('--core-rx'); section.style.removeProperty('--core-ry');
          resetCard(previousCard); previousCard = null;
        };
        const move = event => {
          if (reduced.matches || !pointer.matches || event.pointerType === 'touch' || section.dataset.phase !== 'connected') return;
          pendingPointer = {x:event.clientX,y:event.clientY,card:event.target.closest('.brik-core-service')};
          if (frame) return;
          frame = requestAnimationFrame(() => {
            frame = 0;
            const p = pendingPointer, rect = section.getBoundingClientRect();
            const x = Math.max(0,Math.min(1,(p.x-rect.left)/rect.width));
            const y = Math.max(0,Math.min(1,(p.y-rect.top)/rect.height));
            section.style.setProperty('--core-rx',((0.5-y)*6).toFixed(2)+'deg');
            section.style.setProperty('--core-ry',((x-0.5)*10).toFixed(2)+'deg');
            if (previousCard !== p.card) resetCard(previousCard);
            previousCard = p.card;
            if (p.card) {
              const c = p.card.getBoundingClientRect();
              const cx = Math.max(0,Math.min(1,(p.x-c.left)/c.width));
              const cy = Math.max(0,Math.min(1,(p.y-c.top)/c.height));
              p.card.style.setProperty('--card-rx',((0.5-cy)*4).toFixed(2)+'deg');
              p.card.style.setProperty('--card-ry',((cx-0.5)*5).toFixed(2)+'deg');
              p.card.style.setProperty('--card-light-x',(cx*100).toFixed(1)+'%');
              p.card.style.setProperty('--card-light-y',(cy*100).toFixed(1)+'%');
            }
          });
        };
        const motionChanged = () => {
          section.dataset.reduced = String(reduced.matches);
          if (reduced.matches) { finishEntrance(); resetPointer(); }
        };
        section.addEventListener('pointermove',move,{passive:true});
        section.addEventListener('pointerleave',resetPointer);
        section.addEventListener('focusin',finishEntrance);
        reduced.addEventListener('change',motionChanged);
        motionChanged(); drawConnections();
        document.fonts?.ready.then(() => { if (live) drawConnections(); });
        return () => {
          live = false; resize.disconnect(); reveal.disconnect(); entrance.disconnect();
          phaseTimers.forEach(clearTimeout);
          if (frame) cancelAnimationFrame(frame);
          section.removeEventListener('pointermove',move); section.removeEventListener('pointerleave',resetPointer);
          section.removeEventListener('focusin',finishEntrance);
          reduced.removeEventListener('change',motionChanged);
        };
      },[]);
      const logo = window.location.protocol === 'file:' && !window.location.pathname.includes('/dist/') ? 'public/assets/logo.png' : 'assets/logo.png';
      return (
        <section ref={sectionRef} className="brik-core-section" data-ready="false" data-phase="idle" data-skip-intro="false" data-visible="false" data-engaged={active >= 0} aria-labelledby="brik-core-title">

                  <path className="brik-core-wire" pathLength="100" />
                  <path className="brik-core-signal" pathLength="100" />
                  <circle className="brik-core-port" r="3.5" />
                </g>
              ))}
            </svg>
            <div className="brik-core-logo-slot">
              <div ref={logoRef} className="brik-core-logo-anchor">
                <div className="brik-core-logo-halo" aria-hidden="true"></div>
                <div className="brik-core-logo-arrival">
                  <div className="brik-core-logo-float">
                    <div className="brik-core-logo-tilt">
                      <span className="brik-core-logo-edge" aria-hidden="true"></span>
                      <img src={logo} width="512" height="512" alt="Brik Systems — the center of your connected business" className="brik-core-logo-image" decoding="async" />

                        <span className="brik-core-brand-piece brik-core-piece-2"></span>

    function HeroAmbientGlow() {
      const glowRef = useRef(null);
      useEffect(() => {
        const layer = glowRef.current;
        const hero = layer?.closest('.brik-home-hero');
        if (!hero) return;
        const finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        let frame = 0;
        let pointerX = 0;
        let pointerY = 0;
        const paint = () => {
          frame = 0;
          const rect = hero.getBoundingClientRect();
          const x = pointerX - rect.left;
          const y = pointerY - rect.top;
          const edgeDistance = Math.min(x, rect.width - x);
          const strength = Math.max(0, Math.min(1, 1 - edgeDistance / (rect.width * 0.32)));
          layer.style.setProperty('--glow-x', (x - 220) + 'px');
          layer.style.setProperty('--glow-y', (y - 220) + 'px');
          layer.style.setProperty('--glow-opacity', String(strength));
        };
        const move = event => {
          if (!finePointer.matches || reducedMotion.matches || event.pointerType === 'touch') return;
          pointerX = event.clientX;
          pointerY = event.clientY;
          if (!frame) frame = requestAnimationFrame(paint);
        };
        const leave = () => {
          if (frame) cancelAnimationFrame(frame);
          frame = 0;
          layer.style.setProperty('--glow-opacity', '0');
        };
        hero.addEventListener('pointermove', move, { passive: true });
        hero.addEventListener('pointerleave', leave);
        return () => {
          hero.removeEventListener('pointermove', move);
          hero.removeEventListener('pointerleave', leave);
          if (frame) cancelAnimationFrame(frame);
        };
      }, []);
      return (
        <div ref={glowRef} className="hero-ambient" aria-hidden="true">
          <div className="hero-ambient-glow hero-ambient-left"></div>
          <div className="hero-ambient-glow hero-ambient-right"></div>
          <div className="hero-cursor-glow"></div>
        </div>
      );
    }
